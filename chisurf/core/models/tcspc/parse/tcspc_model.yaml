---
1-Lifetime:
  equation: a1*exp(-x/tau1)
  initial:
    a1: 1
    tau1: 4
  description: "Single-exponential decay, amplitude a1 and lifetime tau1 (ns)."
2-Lifetimes:
  equation: a1*exp(-x/tau1)+a2*exp(-x/tau2)
  initial:
    a1: 1
    tau1: 2
    a2: 1
    tau2: 4
  description: "Sum of two exponentials: amplitudes a1, a2 and lifetimes tau1, tau2 (ns)."
3-Lifetimes:
  equation: a1*exp(-x/tau1)+a2*exp(-x/tau2)+a3*exp(-x/tau3)
  initial:
    a1: 1
    tau1: 4
    a2: 1
    tau2: 2
    a3: 1
    tau3: 1
  description: "Sum of three exponentials: amplitudes a1..a3 and lifetimes tau1..tau3 (ns)."
Transient-Quenching:
  equation: p0*exp(-x/tau0-4*pi*Rdye*Ddye*Nq**2/Vav*x*(1+2*Rdye/sqrt(pi*Ddye*x)))
  initial:
    p0: 1
    tau0: 4
    Rdye: 7.5
    Ddye: 40
    Nq: 1
    Vav: 16755
  description: "Transient (diffusion-limited) quenching of one dye (lifetime tau0, amplitude p0) by Nq quenchers in the volume Vav: Smoluchowski term with dye radius Rdye and diffusion coefficient Ddye."
Transient-Quenching Empirical:
  equation: p0*exp(-a*x-2*b*sqrt(x))
  initial:
    p0: 1
    a: 1
    b: 1
  description: "Empirical transient (diffusion-limited) quenching: exp(-a t - 2 b sqrt(t)), amplitude p0; a is the stationary rate, b the transient term."
Transient-Quenching 2-state:
  equation: a1*exp(-x/tau0-4*pi*Rdye*Ddye*Nq**2/Vav*x*(1+2*Rdye/sqrt(pi*Ddye*x)))+a2*exp(-x/tau0)
  initial:
    a1: 0.5
    a2: 0.5
    tau0: 4
    Rdye: 7.5
    Ddye: 40
    Nq: 1
    Vav: 16755
  description: "Two populations of one dye (lifetime tau0): a1 quenched transiently by Nq quenchers in the volume Vav (Smoluchowski term with dye radius Rdye and diffusion coefficient Ddye), a2 unquenched."
2-Lifetimes, 1-Rate:
  equation: a1*exp(-x*(1/tau1+kQ))+a2*exp(-x*(1/tau2+kQ))
  initial:
    a1: 1
    tau1: 4
    a2: 1
    tau2: 2
    kQ: 0.5
  description: "Two donor lifetimes tau1, tau2 (amplitudes a1, a2), both quenched by one additional rate kQ (1/ns)."
2-Lifetimes, 1-Rate, 0-Rate:
  equation: p0*((1-xD)*(a1*exp(-x*(1/tau1+kQ))+a2*exp(-x*(1/tau2+kQ)))+xD*(a1*exp(-x*(1/tau1))+a2*exp(-x*(1/tau2))))
  initial:
    p0: 1
    xD: 0.5
    a1: 1
    tau1: 4
    a2: 1
    tau2: 2
    kQ: 0.5
  description: "A fraction xD of donors without quencher (lifetimes tau1, tau2) and 1 - xD quenched by the rate kQ; overall amplitude p0."
1-Lifetime, 1-Rate:
  equation: a1*exp(-x*(1/tau1+kQ))
  initial:
    a1: 1
    tau1: 4
    kQ: 0.5
  description: "One donor lifetime tau1 (amplitude a1) quenched by an additional rate kQ (1/ns)."
1-Lifetime, 1-Rate, 0-Rate:
  equation: p0*((1-aD)*exp(-x*(1/tau1+kQ))+aD*exp(-x*(1/tau1)))
  initial:
    p0: 1
    aD: 0.5
    tau1: 4
    kQ: 0.5
  description: "A fraction aD of donors without quencher (lifetime tau1) and 1 - aD quenched by the rate kQ; overall amplitude p0."
2-Lifetime, 2-Rates, 1-Higher-order:
  equation: "(ad1 * exp(-x/td1) + (1-ad1) * exp(-x/td2)) * abs(aDO) / (abs(aDO)  +
    abs(aDA) + abs(aDAA)) +(ad1 * exp(-x/td1) + (1-ad1) * exp(-x/td2)) * (af1A * exp(-x*abs(kf1A))
    + (1-af1A) * exp(-x*abs(kf2A))) * abs(aDA) / (aDO + abs(aDA) + abs(aDAA)) + (ad1
    * exp(-x/td1) + (1-ad1) * exp(-x/td2)) * (af1A * exp(-x*abs(kf1A)) + (1-af1A)
    * exp(-x*abs(kf2A))) * exp(-x*abs(kfAA)) * abs(aDAA) / (aDO + abs(aDA) + abs(aDAA))"
  initial:
    ad1: 0.5
    td1: 2.7
    td2: 1.5
    aDO: 1
    aDA: 0.5
    aDAA: 0.1
    af1A: 0.5
    kf1A: 0.1
    kf2A: 1
    kf1AA: 0.01
  description: This fit considers a donor with two inherent lifetimes which are both
    quenched by two global FRET-rates. Additionally a donor-fraction is fitted and
    a fraction of higher order FRET-states. <li>fd0 = (ad1 * exp(-x/td1) + (1-ad1)
    * exp(-x/td2))</li><li>e1 = (af1 * exp(-x*kf1) + (1-af1) * exp(-x*kf2))</li><li>e2
    = exp(-x*kf3)</li><li>aDO = (1 - aDA + aDAA)</li>The overall fitting models is
    given by:<strong><p>f(t) = fd0*aDo + aDA * e1 * fd0 + aDAA * e1 * fd0</p></strong>The
    amplitudes are named by -a-. However, they are pre-factors of the exponential
    and thus species amplitudes. They nameing is only due to limitations of the program
    (x is a forbidden letter).