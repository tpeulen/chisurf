# --- PAM-derived FCS models (ported from junk/PAM/Models/fcs, A/B-verified). x in s. ---
3D diffusion (D, triplet):
  equation: y_0+1/sqrt(8)*(1/N)*(1+Trip/(1-Trip)*exp(-x/(tau_T*0.000001)))*(1/(1+4*D*x/w_r**2))*(1/sqrt(1+4*D*x/w_z**2))
  initial:
    N: 1
    D: 373
    w_r: 0.2
    w_z: 1
    tau_T: 1
    Trip: 0.05
    y_0: 0
  description: One-component 3D normal diffusion with a triplet term (PAM FCS_D). Absolute D. x in s, D in um^2/s, w_r/w_z in um, tau_T in us.
3D diffusion, 2 components (D, triplet):
  equation: y_0+1/sqrt(8)*(1/(N_1+N_2)**2)*(1+Trip/(1-Trip)*exp(-x/(tau_T*0.000001)))*(N_1*(1/(1+4*D_1*x/w_r**2))*(1/sqrt(1+4*D_1*x/w_z**2))+N_2*(1/(1+4*D_2*x/w_r**2))*(1/sqrt(1+4*D_2*x/w_z**2)))
  initial:
    N_1: 1
    D_1: 373
    N_2: 1
    D_2: 10
    w_r: 0.2
    w_z: 1
    tau_T: 1
    Trip: 0.05
    y_0: 0
  description: Two-component 3D diffusion with a global triplet term (PAM FCS_D_2Component). Absolute D.
3D diffusion, 2 triplet (D):
  equation: y_0+1/sqrt(8)*(1/N)*(1+Trip/(1-Trip)*exp(-x/(tau_T*0.000001)))*(1+Trip_2/(1-Trip_2)*exp(-x/(tau_T2*0.000001)))*(1/(1+4*D*x/w_r**2))*(1/sqrt(1+4*D*x/w_z**2))
  initial:
    N: 1
    D: 373
    w_r: 0.2
    w_z: 1
    tau_T: 1
    Trip: 0.05
    tau_T2: 5
    Trip_2: 0.05
    y_0: 0
  description: One-component 3D diffusion with two exponential triplet/blinking terms (PAM FCS_D_2exp).
3D diffusion (tauD, triplet):
  equation: y_0+1/sqrt(8)*(1/N)*(1+Trip/(1-Trip)*exp(-x/(tau_T*0.000001)))*(1/(1+x/(tau_D*0.000001)))*(1/sqrt(1+(1/p**2)*x/(tau_D*0.000001)))
  initial:
    N: 1
    tau_D: 30
    p: 5
    tau_T: 1
    Trip: 0.05
    y_0: 0
