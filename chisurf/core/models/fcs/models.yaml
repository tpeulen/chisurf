3D Gauss:
  equation: b+1/abs(N)*(1+x/td)**(-1)/sqrt(1+1/s**2*x/td)
  initial:
    N: 1
    s: 3.5
    td: 0.5
    b: 1
  description: Three-dimensional free diffusion with a Gaussian confocal detection volume
3D Gauss, 1 bunching:
  equation: b+1/abs(N)*(1+x/td)**(-1)*(1+1/s**2*x/td)**(-0.5)*(1-ba+ba*exp(-x/bt))
  initial:
    N: 1
    s: 3.5
    td: 0.5
    b: 1
    bt: 0.002
    ba: 0.1
  description: 3D Gaussian diffusion with one exponential blinking / bunching relaxation term
3D Gauss, 2 diffusion terms, 1 global bunching:
  equation: b+1/abs(N)*(a1*(1+x/td1)**(-1)*(1+1/s**2*x/td1)**(-0.5)+(1-a1)*(1+x/td2)**(-1)*(1+1/s**2*x/td2)**(-0.5))*(1-ba+ba*exp(-x/bt))
  initial:
    N: 5
    s: 3.5
    td1: 0.1
    a1: 0.5
    td2: 0.5
    b: 1
    bt: 0.002
    ba: 0.1
  description: Mixture of two 3D Gaussian diffusion components with one global exponential bunching term
3D Gauss, 2 diffusion terms, 2 global bunching:
  equation: b+1/abs(N)*(a1*(1+x/td1)**(-1)*(1+1/s**2*x/td1)**(-0.5)+(1-a1)*(1+x/td2)**(-1)*(1+1/s**2*x/td2)**(-0.5))*(1-ba1+ba1*exp(-x/bt1)-ba2+ba2*exp(-x/bt2))
