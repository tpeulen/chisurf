# Reference dyes a lab measures beside its samples: a single, known fluorescence lifetime, so the
# instrument response can be recovered from their decay when no scatter (water, Ludox) was measured
# (the IRF Estimation tool: chisurf.plugins.fluorescence_decay.irf_estimator.core.extraction.
# irf_from_reference). A file is matched by its name.
# pattern: regular expression on the file stem (case-insensitive)
# The lifetime of each dye is the dye database's (chisurf.core.fluorescence.dyes, beside its D),
# looked up by the name; a dye it has no lifetime for has it fitted to its tail.
- name: Rh110
  pattern: 'rh[-_ ]?110|rhodamine[-_ ]?110'
- name: Rh6G
  pattern: 'rh[-_ ]?6g|rhodamine[-_ ]?6g'
- name: Fluorescein
  pattern: 'fluorescein'
- name: Alexa488
  pattern: 'alexa[-_ ]?(fluor[-_ ]?)?488|a488'
- name: Alexa647
  pattern: 'alexa[-_ ]?(fluor[-_ ]?)?647|a647'
- name: Cy5
  pattern: 'cy[-_ ]?5(?![.0-9])'
