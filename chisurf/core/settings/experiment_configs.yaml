# Experiment configurations for ChiSurf
# This file defines the configuration for each experiment type, including readers and models

# Basic experiment type definitions
experiment_types:
  tcspc:
    name: TCSPC
    hidden: false
  fcs:
    name: FCS
    hidden: false
  pcf:
    name: PCF
    hidden: false
  ics:
    name: Image correlation
    hidden: false
  pch:
    name: PCH
    hidden: false
  pda:
    name: PDA
    hidden: false
  mfd:
    name: MFD
    hidden: false
  deer:
    name: DEER
    hidden: false
  stopped_flow:
    name: Stopped flow
    hidden: true
  structure:
    name: Modelling
    hidden: false

tcspc:
  readers:
    - reader_class: chisurf.core.experiments.tcspc.TCSPCReader
      reader_params:
        name: TXT/CSV
    - reader_class: chisurf.core.experiments.tcspc.TCSPCTTTRReader
      reader_params:
        name: TTTR-file
    - reader_class: chisurf.core.experiments.tcspc.sdt_reader.SDTReader
      reader_params:
        name: Becker-SDT
    - reader_class: chisurf.core.experiments.tcspc.TCSPCSimulatorSetup
      reader_params:
        name: Simulator
        sample_name: Dummy-sample
        lifetime_spectrum: [0.4, 1.1, 0.6, 4.1]
        rotation_spectrum: [0.2, 1.0]
  models:
    # Owned by BFF and described in data (IMP.bff data/model_search/); ChiSurf
    # shows a view on it.
    # "Lifetime": the classic lifetime fit, anisotropy included -- BFF's
    # polarised description, which at magic angle is tcspc_lifetime exactly.
    - chisurf.core.models.description.tcspc_polarized
    # Mixes the lifetimes other described fits publish.
    - chisurf.core.models.description.tcspc_mixture
    # FRET: a donor quenched over a distance distribution, one description
    # per distance family.
    - chisurf.core.models.description.tcspc_fret_gaussian
    - chisurf.core.models.description.tcspc_fret_discrete
    - chisurf.core.models.description.tcspc_fret_worm_like_chain
    - chisurf.core.models.description.tcspc_fret_saw_nu
    - chisurf.core.models.description.tcspc_fret_ising_chain
    # Energy migration between two chromophores, through BFF's transfer kinetics.
    - chisurf.core.models.description.tcspc_pddem
    # A donor quenched by acceptors at a density in 1, 2 or 3 dimensions.
    - chisurf.core.models.description.tcspc_fret_acceptor_density
    - chisurf.core.models.tcspc.parse.tcspc_parse.ParseDecayModel
    - chisurf.core.models.tcspc.fret_structure.FRETStructure
    # Maximum-entropy distributions over the instrument's own basis.
    - chisurf.core.models.description.tcspc_maxent_lifetime
    - chisurf.core.models.description.tcspc_maxent_fret
    # The live acquisition: no parameters, four pages over the pipeline snapshot.
    - chisurf.core.models.acquisition.acquisition_model.AcquisitionModel


stopped_flow:
  readers:
    - reader_class: chisurf.core.experiments.tcspc.TCSPCReader
      reader_params:
        name: TXT/CSV
    - reader_class: chisurf.core.experiments.tcspc.TCSPCTTTRReader
      reader_params:
        name: TTTR-file
  models:
    - chisurf.core.models.stopped_flow.parse.ParseStoppedFlowModel
    - chisurf.core.models.stopped_flow.reaction.ReactionModel

# One PDA experiment for both colour counts. Three-colour PDA is not a separate
# experiment: the same reader reads the same files, and the number of colours is
# a reader *setting* that decides whether a burst becomes a row of an S1S2
# histogram (two) or a row of a five-column photon table (three). The model list
# below therefore holds both families; a model that cannot fit the loaded
# payload hides itself via ``supports_data``.
pda:
  readers:
    - reader_class: chisurf.core.experiments.pda2c.Pda2cReader
      reader_params:
        name: PTU/HT3/SPC
        micro_time_ranges:
          - [0, 16000]
          - [0, 16000]
        channels:
          - [0, 3]
          - [1, 2]
    # A three-colour burst table someone else produced.
    - reader_class: chisurf.core.experiments.pda3c.Pda3cBurstTableReader
      reader_params:
        name: Burst table (CSV/NPZ)
    # Three-colour data is scarce; the simulator makes the model openable and
    # lets a fit be checked against a truth the reader itself set.
    - reader_class: chisurf.core.experiments.pda3c.Pda3cSimulatorReader
      reader_params:
        name: Simulator (3-colour)
  models:
    # AutoForm-rendered pure models; the build_model_editor seam wraps these via
    # view_spec() -> *.view.json. See okf/subsystems/gui-autoform.md.
    - chisurf.core.models.pda2c.simple.Pda2cSimpleModel
    - chisurf.core.models.pda2c.pdagauss.Pda2cGaussianDistanceModel
    - chisurf.core.models.pda2c.saw_nu.Pda2cSawNuModel
    - chisurf.core.models.pda2c.dynamic.Pda2cDynamicTwoStateModel
    - chisurf.core.models.pda2c.dynamic_mc.Pda2cDynamicNStateModel
    - chisurf.core.models.pda2c.anisotropy.Pda2cAnisotropyModel
    - chisurf.core.models.pda3c.pda3c.Pda3cModel

deer:
  readers:
    - reader_class: chisurf.core.experiments.deer.DeerReader
      reader_params:
        name: DEER (BES3T/CSV)
  models:
    # Native DEER models (self-contained, NumPy only); AutoForm-rendered.
    - chisurf.core.models.deer.deer.DeerGaussianModel
    - chisurf.core.models.deer.deer.DeerRiceModel
    - chisurf.core.models.deer.deer.DeerTikhonovModel
    - chisurf.core.models.deer.deer.DeerMaxEntModel

fcs:
  readers:
    - reader_class: chisurf.core.experiments.fcs.FCS
      reader_params:
        name: Seidel Kristine
        experiment_reader: kristine
    - reader_class: chisurf.core.experiments.fcs.FCS
      reader_params:
        name: FCS-CSV
        experiment_reader: csv
    - reader_class: chisurf.core.experiments.fcs.FCS
      reader_params:
        name: Zeiss Confocor3
        experiment_reader: confocor3
    - reader_class: chisurf.core.experiments.fcs.FCS
      reader_params:
        name: China FCS
        experiment_reader: china-mat
    - reader_class: chisurf.core.experiments.fcs.FCS
      reader_params:
        name: Ries SFCS
        experiment_reader: ries-mat
    - reader_class: chisurf.core.experiments.fcs.FCS
      reader_params:
        name: PyCorrFit
        experiment_reader: pycorrfit
    - reader_class: chisurf.core.experiments.fcs.FCS
      reader_params:
        name: ALV-Correlator
        experiment_reader: alv
    - reader_class: chisurf.core.experiments.fcs.FCS
      reader_params:
        name: Correlator.com SIN
        experiment_reader: sin
  models:
    - chisurf.core.models.fcs.parse.ParseFCSModel
    - chisurf.core.models.fcs.dye_shape.DyeShapeFCSModel
    - chisurf.core.models.fcs.mdf.MdfFCSModel
    - chisurf.core.models.fcs.general.GeneralFCSModel
    - chisurf.core.models.fcs.kinetics.FCSKineticsModel
    - chisurf.core.models.fcs.maxent_models.MaxEntFCSModel
    - chisurf.core.models.fcs.maxent_models.MaxEntRHModel

pcf:
  # Pair-correlation-function analysis (distribution-of-transit-times fits).
  # Reuses the generic 1D-curve CSV reader; models are the PCF distribution
  # catalogue (chisurf/core/models/pcf/models.yaml) via ParsePCFWidget.
  readers:
    - reader_class: chisurf.core.experiments.fcs.FCS
      reader_params:
        name: PCF-CSV
        experiment_reader: csv
  models:
    - chisurf.core.models.pcf.parse.ParsePCFModel

ics:
  readers:
    - reader_class: chisurf.core.experiments.ics.ICSReader
      reader_params:
        name: Image correlation (RICS/STICS/TICS/iMSD)
        reading_routine: PTU
        channel: 0
  models:
    # One model over the spatiotemporal carpet G(xi, psi, Delta); RICS, STICS,
    # TICS and iMSD are readings of it rather than separate models. The 3D and
    # membrane carpets compete on BIC; the 2D Gaussian that sizes structures has
    # its own editor, as it always had. Both read one catalogue (ics/models.yaml).
    - chisurf.core.models.ics.ics.ImageCorrelationModel
    - chisurf.core.models.ics.ics.IcsGaussian2DModel

mfd:
  readers:
    - reader_class: chisurf.core.experiments.mfd.MfdReader
      reader_params:
        name: MFD (burst folder)
        green: green
        red: red
        n_ratio_bins: 41
        n_micro_time_bins: 41
        micro_time_min: 0.0
        micro_time_max: 8.0
        min_green_photons: 20
        n_signal_bins: 24
        n_span_bins: 6
  models:
    - chisurf.core.models.mfd.Mfd2DModel

pch:
  readers:
    - reader_class: chisurf.core.experiments.pch.PCHReader
      reader_params:
        name: PCH (TTTR)
        reading_routine: PTU
        channel: 0
        bin_time_us: 100.0
        micro_time_range: [0, 65535]
  models:
    - chisurf.core.models.pch.pch_model.PchMultiComponentModel
    - chisurf.core.models.pch.fida_model.FidaModel

structure:
  readers:
    - reader_class: chisurf.core.experiments.modelling.StructureReader
      reader_params: {}
  models:
    - chisurf.core.models.structure.proteinmc_model.ProteinMCModel

global:
  name: Global
  hidden: true
  readers:
    - reader_class: chisurf.core.experiments.globalfit.GlobalFitSetup
      reader_params:
        name: Global-Fit
  models:
    - chisurf.core.models.global_model.globalfit.GlobalFitModel
    - chisurf.core.models.parameter_transform.model.ParameterTransformModel
