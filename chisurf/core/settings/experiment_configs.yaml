# Experiment configurations for ChiSurf
# This file defines the configuration for each experiment type, including readers and models

# Basic experiment type definitions
experiment_types:
  tcspc:
    name: TCSPC
    hidden: false
  fcs:
    name: FCS
    hidden: false
  pcf:
    name: PCF
    hidden: false
  ics:
    name: Image correlation
    hidden: false
  pch:
    name: PCH
    hidden: false
  pda:
    name: PDA
    hidden: false
  c3pda:
    name: c3PDA (3-colour)
    hidden: false
  deer:
    name: DEER
    hidden: false
  stopped_flow:
    name: Stopped flow
    hidden: true
  structure:
    name: Modelling
    hidden: false

tcspc:
  readers:
    - reader_class: chisurf.core.experiments.tcspc.TCSPCReader
      reader_params:
        name: TXT/CSV
      controller_class: chisurf.gui.widgets.experiments.tcspc.controller.TCSPCReaderControlWidget
      controller_params:
        name: CSV/PQ/IBH
      settings_key: tcspc_csv
    - reader_class: chisurf.core.experiments.tcspc.TCSPCTTTRReader
      reader_params:
        name: TTTR-file
      controller_class: chisurf.gui.widgets.experiments.tcspc.controller.TCSPCTTTRReaderControlWidget
      settings_key: tcspc_csv
    - reader_class: chisurf.gui.widgets.experiments.tcspc.bh_sdt.TCSPCSetupSDTWidget
      reader_params:
        name: Becker-SDT
      controller_class: null
    - reader_class: chisurf.core.experiments.tcspc.TCSPCSimulatorSetup
      reader_params:
        name: Simulator
      controller_class: chisurf.gui.widgets.experiments.tcspc.controller.TCSPCSimulatorSetupWidget
  models:
    # Proven hand-written Lifetime editor (unchanged, daily driver).
    - chisurf.gui.widgets.models.tcspc.LifetimeModelWidget
    # PRD-38/PRD-40: additive prototype. Pure compute model whose editor is
    # auto-generated from lifetime.view.json by AutoModelWidget. Lives ALONGSIDE
    # the proven widget above as the "Lifetime (new)" entry to exercise the new
    # typed-widget framework without risking the working Lifetime fit.
    - chisurf.core.models.tcspc.lifetime.LifetimeNewModel
    - chisurf.gui.widgets.models.tcspc.FRETrateModelWidget
    - chisurf.gui.widgets.models.tcspc.GaussianModelWidget
    - chisurf.gui.widgets.models.tcspc.PDDEMModelWidget
    - chisurf.gui.widgets.models.tcspc.WormLikeChainModelWidget
    - chisurf.gui.widgets.models.tcspc.SawNuChainModelWidget
    - chisurf.gui.widgets.models.tcspc.IsingChainModelWidget
    - chisurf.gui.widgets.models.tcspc.ParseDecayModelWidget
    - chisurf.gui.widgets.models.tcspc.LifetimeMixtureModelWidget
    # PRD-40: additive AutoForm prototype for the mixer. Pure compute model whose
    # editor is auto-generated from mix_model.view.json by AutoModelWidget. Lives
    # ALONGSIDE the proven widget above as the "Lifetime mixer (new)" entry.
    - chisurf.core.models.tcspc.lifetime.LifetimeMixtureNewModel
    - chisurf.gui.widgets.models.tcspc.EtModelFreeWidget
    - chisurf.gui.widgets.models.tcspc.FRETStructureWidget
    - chisurf.gui.widgets.models.tcspc.MaxEntLifetimeModelWidget
    - chisurf.gui.widgets.models.tcspc.MaxEntFRETModelWidget


stopped_flow:
  readers:
    - reader_class: chisurf.core.experiments.tcspc.TCSPCReader
      reader_params:
        name: TXT/CSV
      controller_class: chisurf.gui.widgets.experiments.tcspc.controller.TCSPCReaderControlWidget
      controller_params:
        name: CSV/PQ/IBH
      settings_key: tcspc_csv
    - reader_class: chisurf.core.experiments.tcspc.TCSPCTTTRReader
      reader_params:
        name: TTTR-file
      controller_class: chisurf.gui.widgets.experiments.tcspc.controller.TCSPCTTTRReaderControlWidget
      settings_key: tcspc_csv
  models:
    - chisurf.gui.widgets.models.stopped_flow.ParseStoppedFlowWidget
    - chisurf.gui.widgets.models.stopped_flow.ReactionWidget

pda:
  readers:
    - reader_class: chisurf.core.experiments.pda.PdaReader
      reader_params:
        name: PTU/HT3/SPC
        micro_time_ranges:
          - [0, 16000]
          - [0, 16000]
        channels:
          - [0, 3]
          - [1, 2]
      controller_class: chisurf.gui.widgets.experiments.pda.controller.PdaTTTRWidget
      controller_params:
        name: PTU/HT3/SPC
  models:
    # AutoForm-rendered pure models (PRD-38 model/view-spec split). The
    # build_model_editor seam wraps these via view_spec() -> *.view.json.
    - chisurf.core.models.pda.simple.PdaSimpleModel
    - chisurf.core.models.pda.pdagauss.PdaGaussianDistanceModel
    - chisurf.core.models.pda.saw_nu.PdaSawNuModel
    - chisurf.core.models.pda.dynamic.PdaDynamicTwoStateModel
    - chisurf.core.models.pda.dynamic_mc.PdaDynamicNStateModel
    - chisurf.core.models.pda.anisotropy.PdaAnisotropyModel

c3pda:
  readers:
    # The *same* reader as two-colour PDA: three channel groups and two
    # excitation windows put it on the burst-table path instead of the S1S2 one,
    # so a three-colour setup needs no separate TTTR reading code.
    - reader_class: chisurf.core.experiments.pda.PdaReader
      reader_params:
        name: PTU/HT3/SPC
        n_colors: 3
        micro_time_ranges:
          - [0, 8000]      # blue excitation period
          - [8000, 16000]  # green excitation period
        channels:
          - [0]            # blue detector
          - [1]            # green detector
          - [2]            # red detector
      controller_class: chisurf.gui.widgets.experiments.pda.controller.PdaTTTRWidget
      controller_params:
        name: PTU/HT3/SPC
    # A burst table someone else produced.
    - reader_class: chisurf.core.experiments.c3pda.C3PdaBurstTableReader
      reader_params:
        name: Burst table (CSV/NPZ)
      controller_class: null
    # Three-colour data is scarce; the simulator makes the model openable and
    # lets a fit be checked against a truth the reader itself set.
    - reader_class: chisurf.core.experiments.c3pda.C3PdaSimulatorReader
      reader_params:
        name: Simulator
      controller_class: null
  models:
    # AutoForm-rendered pure model (PRD-38 model/view-spec split).
    - chisurf.core.models.c3pda.c3pda.C3PdaModel

deer:
  readers:
    - reader_class: chisurf.core.experiments.deer.DeerReader
      reader_params:
        name: DEER (BES3T/CSV)
      controller_class: chisurf.gui.widgets.experiments.deer.DeerController
      controller_params:
        name: DEER (BES3T/CSV)
  models:
    # Native DEER models (self-contained, numpy/scipy only); AutoForm-rendered (PRD-38).
    - chisurf.core.models.deer.deer.DeerGaussianModel
    - chisurf.core.models.deer.deer.DeerRiceModel
    - chisurf.core.models.deer.deer.DeerTikhonovModel
    - chisurf.core.models.deer.deer.DeerMaxEntModel

fcs:
  readers:
    - reader_class: chisurf.core.experiments.fcs.FCS
      reader_params:
        name: Seidel Kristine
        experiment_reader: kristine
      controller_class: chisurf.gui.widgets.experiments.fcs.FCSController
      controller_params:
        file_type: Kristine files (*.cor)
    - reader_class: chisurf.core.experiments.fcs.FCS
      reader_params:
        name: FCS-CSV
        experiment_reader: csv
      controller_class: chisurf.gui.widgets.experiments.fcs.FCSController
      controller_params:
        file_type: All files (*.*)
    - reader_class: chisurf.core.experiments.fcs.FCS
      reader_params:
        name: Zeiss Confocor3
        experiment_reader: confocor3
      controller_class: chisurf.gui.widgets.experiments.fcs.FCSController
      controller_params:
        file_type: Confocor3 files (*.fcs)
    - reader_class: chisurf.core.experiments.fcs.FCS
      reader_params:
        name: China FCS
        experiment_reader: china-mat
      controller_class: chisurf.gui.widgets.experiments.fcs.FCSController
      controller_params:
        file_type: China FCS .mat files (*.mat)
    - reader_class: chisurf.core.experiments.fcs.FCS
      reader_params:
        name: Ries SFCS
        experiment_reader: ries-mat
      controller_class: chisurf.gui.widgets.experiments.fcs.FCSController
      controller_params:
        file_type: Ries SFCS .mat files (*.mat)
    - reader_class: chisurf.core.experiments.fcs.FCS
      reader_params:
        name: PyCorrFit
        experiment_reader: pycorrfit
      controller_class: chisurf.gui.widgets.experiments.fcs.FCSController
      controller_params:
        file_type: PyCorrFit csv files (*.csv)
    - reader_class: chisurf.core.experiments.fcs.FCS
      reader_params:
        name: ALV-Correlator
        experiment_reader: alv
      controller_class: chisurf.gui.widgets.experiments.fcs.FCSController
      controller_params:
        file_type: ALV-Correlator files (*.asc)
    - reader_class: chisurf.core.experiments.fcs.FCS
      reader_params:
        name: Correlator.com SIN
        experiment_reader: sin
      controller_class: chisurf.gui.widgets.experiments.fcs.FCSController
      controller_params:
        file_type: Correlator.com SIN files (*.sin)
  models:
    - chisurf.gui.widgets.models.fcs.ParseFCSWidget
    - chisurf.gui.widgets.models.fcs.DyeShapeFCSWidget
    - chisurf.core.models.fcs.mdf.MdfFCSModel
    - chisurf.core.models.fcs.general.GeneralFCSModel
    - chisurf.gui.widgets.models.fcs.MaxEntFCSWidget
    - chisurf.gui.widgets.models.fcs.MaxEntRHWidget

pcf:
  # Pair-correlation-function analysis (distribution-of-transit-times fits).
  # Reuses the generic 1D-curve CSV reader; models are the PCF distribution
  # catalogue (chisurf/core/models/pcf/models.yaml) via ParsePCFWidget.
  readers:
    - reader_class: chisurf.core.experiments.fcs.FCS
      reader_params:
        name: PCF-CSV
        experiment_reader: csv
      controller_class: chisurf.gui.widgets.experiments.fcs.FCSController
      controller_params:
        file_type: PCF curves (*.csv *.txt *.dat)
  models:
    - chisurf.gui.widgets.models.pcf.ParsePCFWidget

ics:
  readers:
    - reader_class: chisurf.core.experiments.ics.ICSReader
      reader_params:
        name: Image correlation (RICS/STICS/TICS/iMSD)
        reading_routine: PTU
        channel: 0
      controller_class: chisurf.gui.widgets.experiments.ics.ICSController
      controller_params: {}
  models:
    # One model over the spatiotemporal carpet G(xi, psi, Delta); RICS, STICS,
    # TICS and iMSD are readings of it rather than separate models.
    - chisurf.core.models.ics.ics.ImageCorrelationModel
    - chisurf.core.models.ics.ics.IcsGaussian2DModel

pch:
  readers:
    - reader_class: chisurf.core.experiments.pch.PCHReader
      reader_params:
        name: PCH (TTTR)
        reading_routine: PTU
        channel: 0
        bin_time_us: 100.0
        micro_time_range: [0, 65535]
      controller_class: chisurf.gui.widgets.experiments.pch.PCHController
      controller_params: {}
  models:
    - chisurf.gui.widgets.models.pch.PchMultiComponentModelWidget
    - chisurf.gui.widgets.models.pch.FidaModelWidget

structure:
  readers:
    - reader_class: chisurf.core.experiments.modelling.StructureReader
      reader_params: {}
      controller_class: chisurf.gui.widgets.experiments.modelling.StructureReaderController
  models:
    - chisurf.gui.widgets.models.proteinmc.ProteinMCModelWidget

global:
  name: Global
  hidden: true
  readers:
    - reader_class: chisurf.core.experiments.globalfit.GlobalFitSetup
      reader_params:
        name: Global-Fit
  models:
    - chisurf.gui.widgets.models.global_model.GlobalFitModelWidget
    - chisurf.gui.widgets.models.global_model.ParameterTransformWidget
