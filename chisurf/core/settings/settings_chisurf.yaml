mmfdb:
  fitting_timeout_ms: 5000  # max ms to wait for a fit.run RPC response; raise for slow models
  # Optional path to the same validated mmfdb.yaml used by a standalone server.
  # Explicit values in client override its client block. Leave client empty to
  # reuse the deployment hints without ever copying its admin password.
  config_file: null
  # Optional keys: mode, username, host, cmd_port, pub_port, base_url,
  # timeout_ms. Defaults are embedded + admin at 127.0.0.1:8765. Passwords
  # never belong in this YAML.
  #
  # To connect ChiSurf to a standalone MMFDB server (e.g. the Docker Compose
  # service in docker-compose.mmfdb.yml), switch the client to remote mode:
  #   client:
  #     mode: remote
  #     base_url: http://127.0.0.1:8080
  # For a non-loopback host the base_url must be https:// (or set
  # allow_insecure_http: true on an isolated development network).
  client: {}
  # The identity in-process writes stamp ownership with, and the account the
  # login screen offers first. The embedded desktop database is created with two
  # local accounts — `user`/`user` for everyday work and `admin`/`admin` for
  # administration — and either can sign in without a prompt. Prefer the
  # unprivileged one; switch to `admin` only to administer the database.
  #
  # It may share a name with the bootstrap administrator: the plain row an
  # ordinary write auto-creates for this identity is completed rather than
  # refused, because the database made it from this setting. Once the account
  # has a password of its own it is nobody's to claim.
  default_user_id: user
  save_login: true
  autologin: false
  object_store:
    # Relative to the settings directory (defaults to ~/.chisurf/objects). Keeping
    # it relative lets the object store follow a redirected settings dir, e.g. the
    # hermetic test harness's CHISURF_SETTINGS_DIR.
    root: objects
  last_server: 127.0.0.1
  server_history:
    - 127.0.0.1
optimization:
  global_optimize_local_first: false
  global_threaded_model_update: false
  # Recompute only the local models a parameter change actually reaches, using
  # the fit's factor graph (PRD-68). The selective path is armed solely by a
  # complete parameter-vector assignment and consumed by the very next
  # update_model, so anything else -- a GUI edit of a single value, a structure
  # change -- still recomputes everything. Set to false to always recompute all
  # local models, e.g. for a custom global model whose datasets are coupled by
  # something other than parameter links.
  global_structure_aware_update: true
  leastsq:
    # Relative accuracy of the model function, setting the forward-difference
    # step MINPACK uses for the Jacobian (step = sqrt(epsfcn) * |x|).
    #
    # 0 means "use machine epsilon", i.e. a step of ~1.5e-8 relative. That is
    # far below the noise floor of the decay model -- the convolution is
    # recursive over ~1024 channels, so its relative accuracy is nearer 1e-6 --
    # and the resulting Jacobian columns are dominated by rounding noise. In
    # practice the optimiser then failed to move the lifetimes at all from many
    # starting points. Over 88 randomised fits (four independent conditions:
    # three start seeds, a different noise realisation, and a 3-exponential
    # model), fits reaching chi2r < 1.1 went 60/88 at epsfcn=0 to 83/88 here,
    # for roughly 10-30% more time. 1e-6 was no worse than any alternative in
    # any of the four conditions.
    epsfcn: 1.0e-06
    factor: 100
    ftol: 1.49012e-08
    full_output: true
    gtol: 0
    maxfev: 0
    xtol: 1.49012e-08
  mem:
    factr: 10
    lower_bound: 1.0e-08
    maxfun: 1500000
    maxiter: 150000
    reg_scale: 1
    upper_bound: 10000000
  sampling:
    chi2max: 1000000000
    # blocked: per-block covariance proposal seeded from the curvature at the
    # optimum, with independent sub-problems sampled apart and merged exactly.
    # Measured on a collinear posterior it delivers ~64 effective samples per
    # 1000 model evaluations against ~26 for ensemble and ~0.4 for mcmc. Use
    # 'collapsed' for a linked global fit, where the private parameters are
    # integrated out and only the shared ones sampled. 'ensemble' (walkers that
    # stretch towards each other) and 'slice' (the same directions, sampled by
    # slice sampling instead of accept/reject) need no covariance at all and are
    # the fallback when nothing is known about the posterior.
    method: blocked
    # Chain file format: 'er4' (tab-separated text, readable by anything) or
    # 'hdf5' (compressed table, ~4x smaller -- what a long run needs). Both
    # open in nDXplorer.
    chain_format: er4
    n_runs: 10
    steps: 1000
    substeps: 100
    thin: 1
