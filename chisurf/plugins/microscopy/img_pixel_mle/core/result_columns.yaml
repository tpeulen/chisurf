# Per-model result schemas of the pixel-MLE table (the general rule:
# analysis I/O and computed features are declared in settings, never
# hardcoded). `assemble` in pixel_mle.py walks the schema for the fitted
# model; a model without an entry here takes the generic registry route
# (tau + one column per tttrlib-registry-named free parameter + 2I*),
# which needs no declaration because tttrlib's registry IS its
# declaration.
#
# Column sources:
#   base           a pixel-bookkeeping column of the same name (Y pixel,
#                  X pixel, Pixel Number, Number of Photons (fit window))
#   parameter:<j>  the j-th column of the fitted parameter block
#   flag:<name>    the settings attribute <name>, written as 0/1
#   blank          NaN placeholder (columns the legacy format reserves)
#
# `fit23` is the historical export, byte-for-byte -- reorder or rename
# only knowing every reader of these tables moves with it.
#
# `term` anchors every column in the central mmfdb/flrCIF vocabulary
# (mmfdb_flr_ext.dic); new terms are created there, never here.
# Guarded by test/core/test_analysis_feature_terms.py.

fit23:
  columns:
    - {column: "Y pixel",                        source: base, term: _flr_analysis_feature.pixel_row}
    - {column: "X pixel",                        source: base, term: _flr_analysis_feature.pixel_col}
    - {column: "Pixel Number",                   source: base, term: _flr_analysis_feature.pixel_number}
    - {column: "Number of Photons (fit window)", source: base, term: _flr_analysis_feature.n_photons}
    - {column: "tau",              source: "parameter:0", term: _flr_fit_parameter.tau}
    - {column: "gamma",            source: "parameter:1", term: _flr_fit_parameter.gamma}
    - {column: "r0",               source: "parameter:2", term: _flr_fit_parameter.r0}
    - {column: "rho",              source: "parameter:3", term: _flr_fit_parameter.rho}
    - {column: "BIFL scatter fit?", source: "flag:soft_bifl_scatter", term: _flr_fit_parameter.soft_bifl_scatter}
    - {column: "2I*: P+2S?",       source: "flag:p2s_twoIstar", term: _flr_fit_parameter.p2s_twoIstar}
    - {column: "rS",               source: blank, term: _flr_fit_parameter.r_scatter}
    - {column: "rE",               source: blank, term: _flr_fit_parameter.r_experimental}
    - {column: "2I*",              source: "parameter:4", term: _flr_fit_parameter.twoIstar}
