# Default settings for ltf

verbose: false

estimate_background_parameter:
  enabled: true
  initial_irf_background: 0.0
  fit_irf_background: true
  average_window: 10

analysis_range_parameter:
  count_threshold: 10.0
  area: 0.9999
  start_at_peak: false
  start_fraction: 0.005
  skip_first_channels: 0
  skip_last_channels: 0

estimate_irf_shift_parameters:
  enabled: true
  apply_shift: true
  irf_time_shift_scan_range: [-8.0, 8.0]
  irf_time_shift_scan_n_steps: 20

lifetime_fit_parameter:
  # poisson: deviance 2I* (unbiased; needs raw photon counts);
  # neyman: chi-square weighted by the data (any curve, biased at low counts).
  noise_model: poisson
  find_optimal: false
  maximum_number_of_lifetimes: 6
  prob_threshold: 0.68
  selection_mode: lower
  plot_probabilities: true
  plot_weighted_residuals: true
  randomize_initial_values:
    enabled: false
    min_lifetime: 0.2
    max_lifetime: 5.0
    amplitude_variation: 0.5
    # Fixed local seed per run (default 0): the same command fits the same
    # twice. null draws fresh starting values every fit.
    seed: 0

# VV/VH (polarization-resolved) fit: the anisotropy calibration used when the
# data do not carry it (a vv_vh footer or the TTTR reader's g_factor/l1/l2),
# and the rotation model. G = S_par / S_perp divides the VH channel.
polarization_parameter:
  g_factor: 1.0
  l1: 0.0
  l2: 0.0
  number_of_rotations: 1
  fit_r_infinity: false
  # channel width (ns) of a single-column stacked VV/VH file
  channel_width: 0.008

pile_up_correction:
  enabled: false
  rep_rate: 80.0
  dead_time: 85.0
  measurement_time: 60.0

plot_resulting_fit: false
