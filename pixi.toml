[workspace]
name = "chisurf"
version = "26.dev0"
description = "ChiSurf: an interactive global analysis platform for fluorescence data."
authors = ["Thomas-Otavio Peulen <thomas@peulen.xyz>"]
channels = ["conda-forge", "bioconda"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[environments]
default = []
build = ["build"]
test = ["build", "test"]
dev = ["build", "test", "dev"]
docs = ["docs"]

# ROLE: the dev/runtime conda environment — the source of truth developers use.
# Two sibling lists describe the SAME runtime for other consumers and must be
# kept in sync (conda<->PyPI naming differs): the installable-wheel metadata in
# pyproject.toml [project.dependencies], and the conda-package deps in
# rattler-recipe/recipe.yaml (run:). numpy is unpinned here and resolves to 2.x.
[dependencies]
python = "3.12.*"
# The build-extensions tasks run in the default environment and shell out to
# `python -m pip` (build_tools/build_tttrlib.py, the editable installs), so pip
# must be present here and not only in the `build` feature.
pip = ">=26.0.1,<27"
numpy = "*"
typing-extensions = ">=4.14"
pyyaml = "*"
markdown = "*"
# click-didyoumean was dropped: chisurf.core.cli_support.DidYouMeanGroup is the
# in-tree replacement. pytools was dropped: nothing imports it.
click = "*"
qtpy = "<2.0"
pyqt = "*"
pyqtgraph = "0.13.*"
matplotlib = "*"
scikit-image = "*"
# imageio, tifffile and imagecodecs were dropped: data images are TIFF, through
# tttrlib's bundled libtiff behind chisurf.core.fio.image. pillow is here for
# pictures, not measurements: chimol's render export and the docs figure tooling.
pillow = "*"
# deprecation was dropped: chisurf.core.decorators.deprecated replaces it.
pandas = "*"
scipy = "*"
numba = "*"
boost-cpp = "*"
mdtraj = "*"
pdb2pqr = "*"
ipython = "*"
notebook = "<7"
pyopengl = "*"
pytables = "*"
python-docx = "*"
qtconsole = "*"
# scikit-learn: k-means and GMM for burst selection and ndXplorer clustering,
# PCA for the parameter decomposition, and the H2MM surrogate. (hmmlearn was
# dropped: chisurf.core.math.hmm now provides the Gaussian HMM in-tree.)
scikit-learn = "*"
# HDBSCAN: density-based clustering in ndXplorer. scikit-learn has shipped its
# own implementation since 1.3 and the code falls back to it, but the standalone
# package is faster and supports prediction data, so ship it.
hdbscan = "*"
pygments = "*"
sqlalchemy = ">=2.0"
# Imported directly, so declared directly rather than left to arrive with
# something else: the ZMQ transport, the AV quenching kernel, and the version
# comparison in the startup shim.
pyzmq = ">=25.0"
numexpr = "*"
packaging = "*"
# The conda-forge package providing the `msgpack` module is named
# msgpack-python (`msgpack` does not exist as a conda package).
msgpack-python = ">=1.1.2"
# Build tools for the editable module installs + the local tttrlib source build,
# which run in this default env via `build-extensions`. Formerly a separate
# top-level [build-dependencies] table (deprecated by pixi); numpy/python are
# omitted here because they are already declared above.
cmake-build-extension = ">=0.6.1,<0.7"
cmake = ">=3.31.8,<4"
swig = ">=4.4.0,<5"
ninja = ">=1.13.2,<2"
scikit-build-core = ">=0.12.1,<0.13"
pybind11 = ">=3.0.3,<4"
llvm-openmp = ">=22.1.3,<23"

# PyPI-only runtime deps (no conda package exists). latexify-py backs the LaTeX
# expression renderer in chisurf/gui/widgets/models/parse/latex.py. This block is
# the single home for such deps — the former chisurf-env.yaml pip section is gone.
[pypi-dependencies]
latexify-py = "*"

[pypi-options]
dependency-overrides = { "numpy" = {} }

[feature.build.dependencies]
rattler-build = ">=0.58.0"
cmake = "<4"
ninja = "*"
setuptools = "*"
wheel = "*"
pip = ">=26.0.1,<27"
git = "*"
rattler-index = "*"
jinja2 = "*"
tomli = "*"
micromamba = "*"
eigen = ">=5.0.1,<6"
pybind11 = ">=3.0.3,<4"
cmake-build-extension = ">=0.6.1,<0.7"

[feature.test.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-qt = "*"

[feature.dev.dependencies]
ruff = "*"
mypy = "*"
python-lsp-server = ">=1.14"

[feature.build.tasks]
build-pkg = { cmd = "python build_tools/run_rattler_build.py", depends-on = ["build-extensions"] }
# One cross-platform installer builder (AppImage / DMG / setup.exe).
build-installer = { cmd = "python build_tools/build_installer.py --no-build", depends-on = ["build-pkg"] }

[feature.docs.pypi-dependencies]
sphinx = "*"
sphinx_rtd_theme = "*"
numpydoc = "*"
sphinx-autodoc-typehints = "*"
myst-parser = "*"

[feature.docs.tasks]
docs-plugins = { cmd = "python build_tools/docs/generate_plugin_docs.py" }
docs-screenshots = { cmd = "python docs/guides/make_screenshots.py" }
# docs-manual is retired: the docs/manual/ RST worked-examples are now hand-
# maintained (folded into the Guides section), no longer regenerated from the
# manual.docx. The task is kept for one-off re-imports but is NOT a docs-html dep.
docs-manual = { cmd = "python build_tools/docs/convert_manual.py" }
docs-clean = { cmd = "rm -rf docs/_build" }
docs-html = { depends-on = ["docs-plugins"], cmd = "sphinx-build -E -b html docs docs/_build" }
# Release gate: fails when a review-tracked page (docs/manual) is unreviewed or
# has been edited since its sign-off. Sign pages off in the Help browser or with
# `csc help review-set <path> --reviewer <name>`.
docs-check-reviewed = { cmd = "python -m chisurf.core.cli help review-check" }
# Production build: refuses to publish human-unchecked documentation.
docs-release = { depends-on = ["docs-check-reviewed", "docs-html"] }

[target.win-64.dependencies]
hdf5 = "*"
cmake = "<4"
ninja = "*"

# tttrlib is NOT a conda dependency. The published package (bioconda/PyPI, both
# capped at 0.26.2) lags the source by enough to be wrong rather than merely old:
# it predates the photon simulator (SimEngine) and still carries a compute_ics
# defect that segfaults any image correlation using frame lags. Depending on it
# meant a fresh environment silently got a broken correlator. tttrlib is built
# from source by the `build-tttrlib` task instead, via the tracked
# `modules/tttrlib` symlink (the same sibling-checkout pattern as modules/mmfdb).
[target.linux-64.dependencies]
hdf5 = "*"

 [tasks]
 test-chinet = { cmd = "python -m pytest modules/chinet/test -x -q" }
 # ndxplorer is now pure-Python (no CMake/Eigen); a plain editable install.
 build-ndxplorer = { cmd = "pip install -e modules/ndxplorer --no-deps", inputs = [
     "modules/ndxplorer/pyproject.toml",
     "modules/ndxplorer/ndxplorer/**",
 ] }
 build-quest = { cmd = "pip install -e modules/quest --no-deps", inputs = [
     "modules/quest/pyproject.toml",
     "modules/quest/quest/**",
 ] }
 build-chinet = { cmd = "pip install -e modules/chinet --no-deps", inputs = [
     "modules/chinet/setup.py",
     "modules/chinet/pyproject.toml",
     "modules/chinet/chinet/**",
     ] }
 # tttrlib's only provider: there is no conda package dependency to fall back on,
 # so this builds the source under the modules/tttrlib symlink and fails loudly
 # when it is missing rather than leaving the environment without tttrlib.
 build-tttrlib = { cmd = "python build_tools/build_tttrlib.py", inputs = [
     "build_tools/build_tttrlib.py",
     "modules/tttrlib/pyproject.toml",
     "modules/tttrlib/CMakeLists.txt",
     "modules/tttrlib/src/**",
     "modules/tttrlib/include/**",
     "modules/tttrlib/ext/**",
 ] }
     build-extensions = { depends-on = [
     "build-ndxplorer",
     "build-quest",
     "build-chinet",
     "build-tttrlib",
 ] }
 chisurf = { cmd = "python -m chisurf", depends-on = ["build-extensions", "i18n-compile"] }

# Internationalisation (translation kit). i18n-extract (re)generates the .ts
# source catalogues from .ui forms + data-driven view.json/manifest.json specs;
# i18n-compile compiles them to runtime .qm binaries. `chisurf` depends on the
# compile so a launched GUI always has fresh translations.
i18n-extract = { cmd = "python build_tools/i18n/extract_strings.py" }
i18n-compile = { cmd = "lrelease chisurf/gui/i18n/chisurf_en.ts chisurf/gui/i18n/chisurf_de.ts chisurf/gui/i18n/chisurf_fr.ts", inputs = ["chisurf/gui/i18n/*.ts"], outputs = ["chisurf/gui/i18n/*.qm"] }

test-app-linux = { cmd = "echo 'test-app-linux: requires native pixi environment on Linux'", depends-on = ["build-extensions"] }
# `-m "not slow"` makes the declared marker actually do something: it was
# defined in pyproject and excluded from nothing, so a file marked slow still
# ran in every default sweep. The slow ones build whole windows and grab them --
# a minute against seconds for the rest -- and `test-slow` is how to ask for them.
test = { cmd = "pytest test $(find chisurf/plugins -type d -name test -not -path '*/__pycache__/*') chisurf/gui/widgets/node_editor/tests -k 'not gui and not widget and not window' -m 'not slow'", depends-on = ["build-extensions"] }
test-slow = { cmd = "pytest test $(find chisurf/plugins -type d -name test -not -path '*/__pycache__/*') -m slow", depends-on = ["build-extensions"] }
test-gui = { cmd = "pytest $(find chisurf/plugins -type d -name test -not -path '*/__pycache__/*') chisurf/gui/widgets/node_editor/tests -k 'widget or gui'", depends-on = ["build-extensions"] }
test-doctest = { cmd = "pytest test --doctest-modules", depends-on = ["build-extensions"] }
lint = { cmd = "ruff check chisurf/ test/ && ruff format --check chisurf/ test/" }
fmt = { cmd = "ruff format chisurf/ test/ && ruff check --fix chisurf/ test/" }
typecheck = { cmd = "mypy chisurf/" }
test-cov = { cmd = "pytest test --doctest-modules $(find chisurf/plugins -type d -name test -not -path '*/__pycache__/*') chisurf/gui/widgets/node_editor/tests --cov=chisurf --cov-report=term --cov-report=xml --cov-report=html", depends-on = ["build-extensions"] }
test-linux = { cmd = "docker build -t chisurf-linux -f Dockerfile.linux . && docker run --rm chisurf-linux" }
test-smoke = { cmd = "pytest test/test_basic.py -q", depends-on = ["build-extensions"] }
# PRD-46: run the shipped example scripts + their public-API unit tests. These
# also run as part of the default `test` task (they live under test/), so this is
# a convenience entry point for iterating on the scripts alone.
test-scripts = { cmd = "pytest test/scripts test/models/test_wlc_public_api.py -o addopts='' -q", depends-on = ["build-extensions"] }

