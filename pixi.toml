[workspace]
name = "chisurf"
version = "26.dev0"
description = "ChiSurf: an interactive global analysis platform for fluorescence data."
authors = ["Thomas-Otavio Peulen <thomas@peulen.xyz>"]
channels = ["conda-forge", "bioconda"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[environments]
default = []
build = ["build"]
test = ["build", "test"]
dev = ["build", "test", "dev"]
docs = ["docs"]

# ROLE: the dev/runtime conda environment — the source of truth developers use.
# Two sibling lists describe the SAME runtime for other consumers and must be
# kept in sync (conda<->PyPI naming differs): the installable-wheel metadata in
# pyproject.toml [project.dependencies], and the conda-package deps in
# rattler-recipe/recipe.yaml (run:). numpy is unpinned here and resolves to 2.x.
[dependencies]
python = "3.12.*"
# The build-extensions tasks run in the default environment and shell out to
# `python -m pip` (build_tools/build_tttrlib.py, the editable installs), so pip
# must be present here and not only in the `build` feature.
pip = ">=26.0.1,<27"
numpy = "*"
typing-extensions = ">=4.14"
pyyaml = "*"
markdown = "*"
# HDF5 is a BUILD dependency of tttrlib on every platform — `find_package(HDF5)`
# in its CMake is not optional — and it used to arrive by accident, dragged in by
# PyTables. Dropping PyTables took it out of the macOS environment with it, and
# `build-tttrlib` has been unable to configure there ever since ("Could NOT find
# HDF5"). It was declared for win-64 and linux-64 only, which is why the failure
# looked platform-specific rather than like the missing dependency it is.
hdf5 = "*"
# click-didyoumean was dropped: chisurf.core.cli.support.DidYouMeanGroup is the
# in-tree replacement. pytools was dropped: nothing imports it.
click = "*"
# Plugin-manifest and view-spec validation (chisurf.core.plugin.manifest,
# chisurf.core.dataspec.schema): without it those validators report every
# document valid, because their import fails.
jsonschema = "*"
qtpy = "<2.0"
pyqt = "*"
pyqtgraph = "0.13.*"
matplotlib = "*"
# scikit-image was dropped: regionprops lives in chisurf.core.roi.props and
# the five segmentation primitives the imaging tools used (gaussian,
# threshold_otsu, clear_border, peak_local_max, watershed) in
# chisurf.core.roi.segmentation.
# imageio, tifffile and imagecodecs were dropped: data images are TIFF, through
# tttrlib's bundled libtiff behind chisurf.core.fio.image. pillow is here for
# pictures, not measurements: chimol's render export and the docs figure tooling.
pillow = "*"
# deprecation was dropped: chisurf.core.support.decorators.deprecated replaces it.
# pandas was dropped: chisurf.core.datastore (tttrlib.DataStore) is the
# storage model everywhere in the tree now, and nothing shipped imports
# pandas any more (PRD-82).
scipy = "*"
numba = "*"
# boost-cpp was dropped: nothing links it. The C++ that used to want Boost --
# the burbulator library and the Cython extensions -- is retired, tttrlib
# builds against the C++17 standard library instead, and no built extension
# in the tree or in the local modules records a libboost load command.
ipython = "*"
# nbformat backs the shipped notebook editor (chisurf/plugins/core/code_editor),
# which imports it lazily on first use. It used to arrive transitively via
# `notebook`, removed with the external Jupyter server in 2026-08.
nbformat = "*"
pyopengl = "*"
# WebGPU: the graphics API behind chisurf.gui.chigame, and the platform surface
# plumbing (Qt embedding, offscreen rendering) that goes with it. Both were only
# incidentally present before and are now load-bearing.
# The conda-forge package is `wgpu-py` (PyPI's is `wgpu`, imported as `wgpu`
# either way) -- same mismatch pattern as msgpack-python below. `wgpu` does not
# exist on conda-forge under that name on any platform, which is why `pixi
# install` failed solving *every* environment on *every* platform, not just
# osx-arm64 (the first one pixi happened to report).
wgpu-py = "*"
rendercanvas = "*"
# The window backend for chimol's Qt-free default. `rendercanvas` ships the
# glfw backend but not the binding it needs, so without this the toolkit-free
# run falls back to the offscreen canvas and renders every frame into a buffer
# nobody can see. Deliberately NOT `rendercanvas.auto`, whose last fallback
# imports PyQt5 -- on a machine with Qt installed "automatic" means Qt, which
# is the outcome the Qt-free host exists to avoid.
glfw = "*"
python-docx = "*"
# scikit-learn and hdbscan were dropped: every estimator the tree reached for —
# GMM, k-means, PCA/IncrementalPCA, StandardScaler, the surrogate's MLP, and
# HDBSCAN — now lives in chisurf.core.ml, over a compiled k-d tree / Borůvka
# kernel in the photon library. See okf/subsystems/machine-learning.md.
pygments = "*"
sqlalchemy = ">=2.0"
# Imported directly, so declared directly rather than left to arrive with
# something else: the ZMQ transport, the AV quenching kernel, and the version
# comparison in the startup shim.
pyzmq = ">=25.0"
packaging = "*"
# The conda-forge package providing the `msgpack` module is named
# msgpack-python (`msgpack` does not exist as a conda package).
msgpack-python = ">=1.1.2"
# Build tools for the editable module installs + the local tttrlib source build,
# which run in this default env via `build-extensions`. Formerly a separate
# top-level [build-dependencies] table (deprecated by pixi); numpy/python are
# omitted here because they are already declared above.
cmake-build-extension = ">=0.6.1,<0.7"
cmake = ">=3.31.8,<4"
swig = ">=4.4.0,<5"
ninja = ">=1.13.2,<2"
scikit-build-core = ">=0.12.1,<0.13"
pybind11 = ">=3.0.3,<4"
# imp-bff's own standalone/CMakeLists.txt (it is built from source now, see
# the imp-bff pypi-dependency below) needs these three C++ header libraries
# unconditionally (`find_package(Eigen3 REQUIRED CONFIG)`, `find_package(Boost
# 1.66 REQUIRED)` for boost/random only, and cereal). libboost-headers, not
# `boost` or `boost-cpp`, because only the headers are needed -- no compiled
# Boost libraries or the Python bindings `boost` pulls in.
eigen = "*"
libboost-headers = "*"
cereal = "*"
llvm-openmp = ">=22.1.3,<23"

# PyPI-only runtime deps (no conda package exists). latexify-py backs the LaTeX
# expression renderer in chisurf/gui/widgets/models/parse/latex.py. This block is
# the single home for such deps — the former chisurf-env.yaml pip section is gone.
[pypi-dependencies]
latexify-py = "*"
# The node-graph editor toolkit: chisurf.gui.widgets.node_editor and chimol
# import emtk.qt_host unguarded, so it is not optional. Not on conda-forge;
# real PyPI package (tpeulen's own, published 2026-09). Declared here, not
# just in pyproject.toml's [project.dependencies], because pixi.toml's own
# [pypi-dependencies] is what the solver actually reads -- pyproject.toml's
# list is metadata for a bare `pip install chisurf`, not consumed by pixi.
emtk = "*"
# imp-bff (PyPI name; imports as IMP.bff) is the structure/dye-simulation/
# scoring engine: AV backend, structure I/O and kappa-squared correction all
# import it unguarded. Bare `imp` (the full IMP suite) is no longer a chisurf
# dependency -- nothing in this tree does `import IMP`/`IMP.atom`/`IMP.em`/
# `IMP.rmf` anymore, only `IMP.bff` (structure reading, RMF writing, MRC
# writing all moved onto bff doors, see okf/references/imp-ecosystem.md,
# PRD-137). The FRET docking plugin still needs an imp-bff build linked
# against IMP (`get_build() == "core+imp"`) for its workflow layer; that is a
# build-time choice of the imp-bff wheel, not a separate chisurf dependency.
#
# Not on PyPI yet (still alpha, 2026-09-17 owner's call: GitHub only for now,
# no PyPI publish). Built from source at solve time from tpeulen's fork --
# the toolchain this needs (cmake, ninja, swig, scikit-build-core) is already
# in every environment here for tttrlib's own from-source build. Once a real
# PyPI release exists, drop back to `imp-bff = "*"`.
imp-bff = { git = "https://github.com/tpeulen/IMP.bff.git", branch = "independent-core" }

[pypi-options]
dependency-overrides = { "numpy" = {} }

[feature.build.dependencies]
rattler-build = ">=0.58.0"
cmake = "<4"
ninja = "*"
setuptools = "*"
wheel = "*"
pip = ">=26.0.1,<27"
git = "*"
rattler-index = "*"
jinja2 = "*"
tomli = "*"
micromamba = "*"
eigen = ">=5.0.1,<6"
pybind11 = ">=3.0.3,<4"
cmake-build-extension = ">=0.6.1,<0.7"

[feature.test.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-qt = "*"
# Test-only: a handful of tests use pandas as an independent oracle (compare
# chisurf's own CSV writer against pandas.DataFrame.to_csv) or to simulate a
# file an external tool wrote. The shipped package imports it nowhere
# (PRD-82), which is why this lives here and not in [dependencies].
pandas = "*"
# Test-only notebook execution (test/plugins/burst/test_mmfdb_example_notebooks.py):
# nbconvert + ipykernel were dragged in by the `notebook` runtime dependency,
# removed in 2026-08; the slow example-notebook test still needs them.
nbconvert = "*"
ipykernel = "*"

[feature.dev.dependencies]
ruff = "*"
mypy = "*"
python-lsp-server = ">=1.14"

[feature.build.tasks]
build-pkg = { cmd = "python build_tools/run_rattler_build.py", depends-on = ["build-extensions"] }
# One cross-platform installer builder (AppImage / DMG / setup.exe).
build-installer = { cmd = "python build_tools/build_installer.py --no-build", depends-on = ["build-pkg"] }

[feature.docs.pypi-dependencies]
sphinx = "*"
sphinx_rtd_theme = "*"
numpydoc = "*"
sphinx-autodoc-typehints = "*"
myst-parser = "*"

[feature.docs.tasks]
docs-plugins = { cmd = "python build_tools/docs/generate_plugin_docs.py" }
docs-specs = { cmd = "python build_tools/docs/generate_spec_rst.py" }
docs-screenshots = { cmd = "python docs/guides/make_screenshots.py" }
# docs-manual is retired: the docs/manual/ RST worked-examples are now hand-
# maintained (folded into the Guides section), no longer regenerated from the
# manual.docx. The task is kept for one-off re-imports but is NOT a docs-html dep.
docs-manual = { cmd = "python build_tools/docs/convert_manual.py" }
docs-clean = { cmd = "rm -rf docs/_build" }
# The Literature page is generated from docs/references/bibliography.yaml, which
# is the single source for every work the documentation cites.
docs-bibliography = { cmd = "python build_tools/docs/make_bibliography.py" }
# docs/ is an Open Knowledge Format bundle: every page carries a machine-readable
# header (kind, title, description, tags) that the in-application assistant
# navigates by. Derived from the page, never hand-written; hand-edited fields
# survive a re-run.
docs-frontmatter = { cmd = "python build_tools/docs/okf_frontmatter.py" }
docs-check-frontmatter = { cmd = "python build_tools/docs/okf_frontmatter.py --check" }
docs-html = { depends-on = ["docs-plugins", "docs-bibliography", "docs-frontmatter"], cmd = "sphinx-build -E -b html docs docs/_build" }
# Release gate: fails when a review-tracked page (docs/manual) is unreviewed or
# has been edited since its sign-off. Sign pages off in the Help browser or with
# `csc help review-set <path> --reviewer <name>`.
docs-check-reviewed = { cmd = "python -m chisurf.core.cli help review-check" }
# Production build: refuses to publish human-unchecked documentation.
docs-release = { depends-on = ["docs-check-frontmatter", "docs-check-reviewed", "docs-html"] }

[target.win-64.dependencies]
cmake = "<4"
ninja = "*"

# eigen/libboost-headers/cereal (added for imp-bff's from-source build, see
# the imp-bff pypi-dependency below) need to be found by CMake on Windows.
# Confirmed so far (2026-09-17, iterating against real CI): eigen's CMake
# config resolves once %CONDA_PREFIX%\Library is on CMAKE_PREFIX_PATH --
# conda-forge's Windows build installs it under %CONDA_PREFIX%\Library\cmake\,
# not %CONDA_PREFIX%\cmake\ the way the Unix "prefix" layout does. cereal
# still failed after that fix, at the find_path(cereal/cereal.hpp) fallback --
# cereal is a noarch (header-only, platform-independent) conda-forge package,
# which may not follow the same Library\ convention compiled packages do.
# Covering both possible layouts rather than guessing further at which one
# noarch packages actually use; still unverified on a real Windows runner.
[target.win-64.activation.env]
CMAKE_PREFIX_PATH = "%CONDA_PREFIX%;%CONDA_PREFIX%\\Library;%VCPKG_INSTALLATION_ROOT%\\installed\\x64-windows"
# conda-forge's Windows hdf5 package is not discoverable by tttrlib's
# `find_package(HDF5 REQUIRED COMPONENTS C)` (traditional, non-config-mode
# finder) -- confirmed failing on real CI ("Could NOT find HDF5") even with
# hdf5 installed and both HDF5_ROOT and CMAKE_PREFIX_PATH pointed at the
# conda env. tttrlib's own CI hits the same wall and works around it with a
# vcpkg-built HDF5 (see the "Install HDF5 via vcpkg (Windows)" CI step,
# which installs to %VCPKG_INSTALLATION_ROOT%\installed\x64-windows).
# windows-2022/-latest runners ship vcpkg pre-installed with
# VCPKG_INSTALLATION_ROOT already set.
HDF5_ROOT = "%VCPKG_INSTALLATION_ROOT%\\installed\\x64-windows"
PATH = "%VCPKG_INSTALLATION_ROOT%\\installed\\x64-windows\\bin;%PATH%"

# tttrlib is NOT a conda dependency. The published package (bioconda/PyPI, both
# capped at 0.26.2) lags the source by enough to be wrong rather than merely old:
# it predates the photon simulator (SimEngine) and still carries a compute_ics
# defect that segfaults any image correlation using frame lags. Depending on it
# meant a fresh environment silently got a broken correlator. tttrlib is built
# from source by the `build-tttrlib` task instead, via the tracked
# `modules/tttrlib` symlink (the same sibling-checkout pattern as modules/mmfdb).

 [tasks]
 # ndxplorer is now pure-Python (no CMake/Eigen); a plain editable install.
 build-ndxplorer = { cmd = "pip install -e modules/ndxplorer --no-deps", inputs = [
     "modules/ndxplorer/pyproject.toml",
     "modules/ndxplorer/ndxplorer/**",
 ] }
 build-quest = { cmd = "pip install -e modules/quest --no-deps", inputs = [
     "modules/quest/pyproject.toml",
     "modules/quest/quest/**",
 ] }
 # tttrlib's only provider: there is no conda package dependency to fall back on,
 # so this builds the source under the modules/tttrlib symlink and fails loudly
 # when it is missing rather than leaving the environment without tttrlib.
 # chimol: editable install of the relocated engine (~/dev/chimol via the
 # modules/chimol symlink) -- the same sibling-checkout pattern as mmfdb.
 # Pure python, no deps: the host environment provides numpy/wgpu/windowing.
 build-chimol = { cmd = "pip install -e modules/chimol --no-deps", inputs = [
     "modules/chimol/pyproject.toml",
 ] }
 build-tttrlib = { cmd = "python build_tools/build_tttrlib.py", inputs = [
     "build_tools/build_tttrlib.py",
     "modules/tttrlib/pyproject.toml",
     "modules/tttrlib/CMakeLists.txt",
     "modules/tttrlib/src/**",
     "modules/tttrlib/include/**",
     "modules/tttrlib/ext/**",
 ] }
     build-extensions = { depends-on = [
     "build-ndxplorer",
     "build-quest",
      "build-tttrlib",
     "build-chimol",
 ] }
 chisurf = { cmd = "python -m chisurf", depends-on = ["build-extensions", "i18n-compile"] }

# Internationalisation (translation kit). i18n-extract (re)generates the .ts
# source catalogues from .ui forms + data-driven view.json/manifest.json specs;
# i18n-compile compiles them to runtime .qm binaries. `chisurf` depends on the
# compile so a launched GUI always has fresh translations.
i18n-extract = { cmd = "python build_tools/i18n/extract_strings.py" }
i18n-compile = { cmd = "lrelease chisurf/gui/i18n/chisurf_en.ts chisurf/gui/i18n/chisurf_de.ts chisurf/gui/i18n/chisurf_es.ts chisurf/gui/i18n/chisurf_fr.ts chisurf/gui/i18n/chisurf_pt.ts chisurf/gui/i18n/chisurf_ru.ts", inputs = ["chisurf/gui/i18n/*.ts"], outputs = ["chisurf/gui/i18n/*.qm"] }

test-app-linux = { cmd = "echo 'test-app-linux: requires native pixi environment on Linux'", depends-on = ["build-extensions"] }
# `-m "not slow"` makes the declared marker actually do something: it was
# defined in pyproject and excluded from nothing, so a file marked slow still
# ran in every default sweep. The slow ones build whole windows and grab them --
# a minute against seconds for the rest -- and `test-slow` is how to ask for them.
test = { cmd = "pytest test $(find chisurf/plugins -type d -name test -not -path '*/__pycache__/*') chisurf/gui/widgets/node_editor/tests -k 'not gui and not widget and not window' -m 'not slow'", depends-on = ["build-extensions"] }
test-slow = { cmd = "pytest test $(find chisurf/plugins -type d -name test -not -path '*/__pycache__/*') -m slow", depends-on = ["build-extensions"] }
test-gui = { cmd = "pytest $(find chisurf/plugins -type d -name test -not -path '*/__pycache__/*') chisurf/gui/widgets/node_editor/tests -k 'widget or gui'", depends-on = ["build-extensions"] }
test-doctest = { cmd = "pytest test --doctest-modules", depends-on = ["build-extensions"] }
lint = { cmd = "ruff check chisurf/ test/ && ruff format --check chisurf/ test/" }
fmt = { cmd = "ruff format chisurf/ test/ && ruff check --fix chisurf/ test/" }
typecheck = { cmd = "mypy chisurf/" }
test-cov = { cmd = "pytest test --doctest-modules $(find chisurf/plugins -type d -name test -not -path '*/__pycache__/*') chisurf/gui/widgets/node_editor/tests -m 'not slow' --cov=chisurf --cov-report=term --cov-report=xml --cov-report=html", depends-on = ["build-extensions"] }
test-linux = { cmd = "docker build -t chisurf-linux -f Dockerfile.linux . && docker run --rm chisurf-linux" }
test-smoke = { cmd = "pytest test/test_basic.py -q", depends-on = ["build-extensions"] }
# PRD-46: run the shipped example scripts + their public-API unit tests. These
# also run as part of the default `test` task (they live under test/), so this is
# a convenience entry point for iterating on the scripts alone.
test-scripts = { cmd = "pytest test/scripts test/models/test_wlc_public_api.py -o addopts='' -q", depends-on = ["build-extensions"] }

