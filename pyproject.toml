[build-system]
requires = [
    "setuptools>=64",
    "wheel",
    "numpy",
]
build-backend = "setuptools.build_meta"

[project]
name = "chisurf"
dynamic = ["version"]
description = "ChiSurf: an interactive global analysis platform for fluorescence data."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [
    {name = "Thomas-Otavio Peulen", email = "thomas@peulen.xyz"}
]
maintainers = [
    {name = "Thomas-Otavio Peulen", email = "thomas@peulen.xyz"}
]
keywords = ["fluorescence", "single-molecule", "spectroscopy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

# ROLE: installable-wheel metadata (PyPI names) for a bare `pip install chisurf`.
# This must stay in sync with the two sibling lists that describe the SAME
# runtime (conda<->PyPI naming differs): the dev env in pixi.toml [dependencies]
# and the conda-package deps in rattler-recipe/recipe.yaml (run:). The app runs
# on numpy 2.x (the canonical pixi env resolves numpy 2.4), so numpy is uncapped.
dependencies = [
    "PyQt5",
    "qtpy",
    "sip",
    "pyqtgraph",
    "numba",
    "numpy",
    # Mandatory; see pixi.toml for why the floor is 2.25.
    "imp>=2.25",
    "scipy",
    # Imported at module scope in shipped code and previously left out of this
    # list: PyOpenGL by the molecular view.
    # pandas, scikit-learn and scikit-image are deliberately NOT here:
    # chisurf.core.datastore (tttrlib.DataStore) is the storage model everywhere
    # in the tree, every estimator the tree uses is in chisurf.core.ml, and the
    # region measurements and segmentation primitives are in chisurf.core.roi.
    "PyOpenGL",
    # WebGPU, used by the chigame engine (chisurf.gui.chigame). wgpu is the
    # graphics API; rendercanvas is the per-platform surface and the offscreen
    # backend the headless render tests depend on.
    "wgpu",
    "rendercanvas",
    "labellib",
    "PyYAML",
    "packaging",
    "typing-extensions",
    "matplotlib",
    "python-docx",
    "markdown",
    "msgpack>=1.1.2",
    "ipython",
    # Backs the shipped notebook editor (lazy import); declared directly since
    # it used to arrive transitively via the removed `notebook` dependency.
    "nbformat",
    "click",
    "pyzmq>=25.0",
    "ruff>=0.4",
    "sqlalchemy>=2.0",
    # Data images are TIFF, through tttrlib's bundled libtiff behind
    # chisurf.core.fio.image. Pillow is here for pictures, not measurements:
    # ChiMOL's render export and the docs figure tooling.
    "Pillow",
    "mmfdb==0.1.0",
]

[project.optional-dependencies]
# Features the application detects at runtime and works without: fast
# histogramming, syntax highlighting, and the LaTeX view of a parse model (an
# in-tree AST converter is the fallback). The external notebook server and its
# `notebook` dependency were removed in 2026-08; scikit-learn and hdbscan in the
# same way, once chisurf.core.ml held every estimator the tree reaches for.
full = [
    "Pygments",
    "latexify-py",
]
dev = [
    "python-lsp-server>=1.14",
    "pytest",
    "pytest-cov",
    "pytest-qt",
    "mypy",
    "ruff",
]
cli = [
    "ptpython>=3.0",
]
postgres = [
    "psycopg[binary]>=3.1",
]
# Optional HTTP surface of the FRET modelling plugin
# (chisurf/plugins/modelling/fret/api/router.py). The plugin imports it behind a
# try, so the analysis code works without these.
api = [
    "fastapi",
    "pydantic",
]
# The spectra scrapers (chisurf/plugins/spectra_downloader/download/) fetch and
# parse vendor pages into the development spectra database. Nothing in the
# application imports them.
scrape = [
    "requests",
    "beautifulsoup4",
    "openpyxl",
]

[project.urls]
Homepage = "https://www.peulen.xyz/downloads/chisurf"
Documentation = "https://github.com/Fluorescence-Tools/chisurf/wiki"
Repository = "https://github.com/Fluorescence-Tools/chisurf"
"Bug Tracker" = "https://github.com/Fluorescence-Tools/chisurf/issues"

[project.scripts]
csc = "chisurf.core.cli:cli"
chimol-cli = "chisurf.plugins.chimol.chimol.app.cli:main"

# Six of these named a plugin's pre-reorganisation location and had done so for
# long enough to ship: the module moved under plugins/calculator, plugins/core
# or plugins/tttr and the launcher was left pointing at the old dotted path, so
# the installed command raised ModuleNotFoundError. test/test_rattler_recipe.py
# resolves every entry point in the conda recipe against the tree to keep this
# from recurring -- the recipe list is generated from this table.
[project.gui-scripts]
chisurf = "chisurf.__main__:main"
csg_kappa2distribution = "chisurf.plugins.calculator.kappa2_dist.__main__:main"
csg_fps_json_edit = "chisurf.plugins.modelling.fps_json_editor.__main__:main"
csg_fret_dock = "chisurf.plugins.modelling.fret.__main__:main"
csg_calculator = "chisurf.plugins.calculator.fret_calculator.__main__:main"
csg_f_test = "chisurf.plugins.core.f_test.__main__:main"
# chimol in a browser: builds the bundle, serves it, opens the page.
csg_chimol_web = "chisurf.plugins.chimol.chimol.web.serve:main"
csg_traj_align = "chisurf.plugins.traj.traj_align.__main__:main"
csg_traj_convert = "chisurf.plugins.traj.traj_convert.__main__:main"
csg_traj_fret_analysis = "chisurf.plugins.traj.fret_trajectory.__main__:main"
csg_traj_join = "chisurf.plugins.traj.traj_join.__main__:main"
csg_traj_energy_calculator = "chisurf.plugins.traj.potential_energy.__main__:main"
csg_traj_remove_clashed_frames = "chisurf.plugins.traj.traj_remove_clashes.__main__:main"
csg_traj_rotate_translate = "chisurf.plugins.traj.traj_rotate_translate.__main__:main"
csg_traj_save_topology = "chisurf.plugins.traj.traj_save_topology.__main__:main"
csg_quest = "quest.quest_gui:start_gui"
csg_ndxplorer = "ndxplorer.__main__:main"
csg_trace_browser = "chisurf.plugins.tttr.trace_browser.__main__:main"
csg_tttr_image_browser = "chisurf.plugins.tttr.tttr_image_browser.__main__:main"
csg_batch_analysis = "chisurf.plugins.core.batch_analysis.__main__:main"
csg_anisotropy = "chisurf.plugins.fluorescence_decay.tr_anisotropy.__main__:main"
csg_wizards = "chisurf.plugins.core.wizards.__main__:main"
csg_calculators = "chisurf.plugins.calculator.hub.__main__:main"
chisurf_update = "chisurf.plugins.core.updater.__main__:main"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
# Installed MMFDB has one owner: the standalone ``mmfdb`` distribution above.
# Source checkouts remain convenient through ``chisurf._bundled_packages``.
where = [".", "modules/chinet"]
include = ["chisurf*", "chinet*"]
namespaces = true

[tool.setuptools.package-data]
"*" = [
    "*.json", "*.yaml",
    # The games' audio: two archives of ADPCM clips beside the engine.
    "*.zip",
    "*.ui", "*.css", "*.qss",
    "*.png", "*.svg",
    "*.csv", "*.npy", "*.dat",
    "*.dll", "*.so", "*.dylib", "*.pyd", "*.ipynb",
    "*.db", "*.txt", "*.dic",
    "*.qm", "*.ts",
    # chigame's shaders are read from disk at pipeline build time, so an
    # installed copy without them raises where a source checkout works.
    "*.wgsl",
    # Agent skills ship as SKILL.md documents beside the code that uses them.
    "*.md"
]
"chisurf.settings.constants" = ["*.json"]

[tool.setuptools.dynamic]
version = {attr = "chisurf.core.info.__version__"}

[tool.pytest.ini_options]
# Coverage is opt-in (use `pixi run test-cov`); keeping it off by default avoids
# dumping .coverage*/htmlcov into the repo root on every test run.
addopts = ""
norecursedirs = ["build_tools", "modules", "conda-bld", ".pixi", "dist", "rattler-recipe", "repro"]
testpaths = ["test", "chisurf/plugins/burst/burst_selection/tests"]
markers = [
    "slow: marks tests as slow (reader-heavy) and excluded from default runs",
    "live_llm: hits a real LLM provider; skipped unless an API key is configured",
]

# Coverage.py config (read by pytest-cov on `pixi run test-cov`). Output is
# redirected under build/ (gitignored) so coverage never clutters the repo root.
# Target thresholds from the test coverage plan: >80% core, >60% GUI.
[tool.coverage.run]
source = ["chisurf"]
data_file = "build/coverage/.coverage"
omit = [
    "*/test/*",
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/build_tools/*",
    "*/rattler-recipe/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
skip_empty = true
sort = "Cover"

[tool.coverage.html]
directory = "build/coverage/html"
show_contexts = true

[tool.coverage.xml]
output = "build/coverage/coverage.xml"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "D",   # pydocstyle — docstring conventions (NumPy-style)
]
ignore = [
    "E501",  # line too long, let formatter handle it
    "D100",  # missing docstring in public module (handled per-module)
    "D104",  # missing docstring in public package (noise for __init__ stubs)
    "D107",  # missing docstring in __init__ (redundant with class docstring)
    "D203",  # 1 blank line before class docstring (conflicts with D211)
    "D212",  # multi-line summary first line (conflicts with D213)
    "D213",  # multi-line summary second line (we use NumPy style)
    "D402",  # first line not function signature (handled by convention)
    "D404",  # first word not "This" (numspy style allows this)
    "D407",  # dashed line under section headers (NumPy style uses dashes)
    "D408",  # section underline matches length (NumPy style doesn't require this)
    "D409",  # section underline matches dashes (NumPy style)
    "D410",  # blank line after section (NumPy style uses blank lines)
    "D411",  # blank line before section (NumPy style)
    "D412",  # no blank lines between header/content (NumPy style)
    "D413",  # blank line after last section (NumPy style)
    "D414",  # non-empty docstring should have description (fine)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D102", "D103"]
"**/test/**" = ["D102", "D103"]
"**/tests/**" = ["D102", "D103"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
show_error_codes = true
# The cookiecutter plugin scaffold is a Jinja templated skeleton
# ({{cookiecutter.plugin_name}} placeholder dir names are not valid packages),
# not code mypy should descend into.
exclude = [
    "chisurf/plugins/cookiecutter-chisurf-plugin/",
    "^chisurf/plugins/cookiecutter-chisurf-plugin$",
]
