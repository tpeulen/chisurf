context:
  name: "chisurf"
  # The version is derived from Git (via CHISURF_VERSION env var) by CI / build_installer.py.
  # Manual builds should prefix with CHISURF_VERSION=$(python rattler-recipe/generate_version.py --print).
  version: ${{ env.get("CHISURF_VERSION") if "CHISURF_VERSION" in env else "26.dev0" }}

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  path: ../

build:
  number: 0
  # SCOPE: this package is chisurf itself and nothing else. ChiSurf is pure
  # Python -- setup.py compiles no C++ (the burbulator library it used to build
  # is retired) -- so the whole build is one pip install and the build/host
  # lists below carry no toolchain. The rest of the runtime (tttrlib, labellib,
  # mmfdb, imp-tricks, the local modules/*) is assembled on top of this package
  # by build_tools/build_installer.py, which is what a user actually installs.
  #
  # An inline `script` is what rattler-build runs; a build.sh/build.bat beside
  # this file would be ignored while it is here. Two such scripts sat here dead
  # for months, still being edited, so do not add one back -- extend this.
  script:
    - python -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      # BEGIN_ENTRY_POINTS (auto-generated by collect_entry_points.py - do not edit manually)
      - csc = chisurf.core.cli:cli
      - chimol-cli = chisurf.plugins.chimol.chimol.app.cli:main
      - pch = chisurf.plugins.pch.cli:cli
      - alex = chisurf.plugins.tttr.ptu_alex_creator.cli.main:cli
      - microtime-histogram = chisurf.plugins.tttr.microtime_histogram.__main__:main
      - count-rate = chisurf.plugins.tttr.tttr_count_rate_analysis.cli:cli
      - lightpath-simulator = chisurf.plugins.core.lightpath_simulator.cli:cli
      - hmm = chisurf.plugins.core.hmm.cli.main:cli
      - fluorophore = mmfdb.admin.cli:cli
      - help = chisurf.plugins.core.help.cli.main:cli
      - fret = chisurf.plugins.modelling.fret.cli.main:main
      - proteinmc = chisurf.plugins.modelling.proteinmc.cli:cli
      - fcs-convert = chisurf.plugins.fcs.fcs_convert.cli:cli
      - burst-background = chisurf.plugins.burst.burst_background.cli:cli
      - burst-selection = chisurf.plugins.burst.burst_selection.cli:cli
      - ndxplorer = chisurf.plugins.ndxplorer.cli:cli
      - lltf = chisurf.plugins.fluorescence_decay.lltf.core.cli:cli
      - sm-image-mle = chisurf.plugins.microscopy.sm_image_mle.cli:cli
      - img-pixel-mle = chisurf.plugins.microscopy.img_pixel_mle.cli:cli
      - clsm = chisurf.plugins.microscopy.clsm.cli:cli
      - psf-determination = chisurf.plugins.microscopy.psf_determination.cli:cli
      - spectra-download = chisurf.plugins.spectra_downloader.cli:cli
      - chisurf = chisurf.__main__:main
      - csg_kappa2distribution = chisurf.plugins.calculator.kappa2_dist.__main__:main
      - csg_fps_json_edit = chisurf.plugins.modelling.fps_json_editor.__main__:main
      - csg_fret_dock = chisurf.plugins.modelling.fret.__main__:main
      - csg_calculator = chisurf.plugins.calculator.fret_calculator.__main__:main
      - csg_f_test = chisurf.plugins.core.f_test.__main__:main
      - csg_traj_align = chisurf.plugins.traj.traj_align.__main__:main
      - csg_traj_convert = chisurf.plugins.traj.traj_convert.__main__:main
      - csg_traj_fret_analysis = chisurf.plugins.traj.fret_trajectory.__main__:main
      - csg_traj_join = chisurf.plugins.traj.traj_join.__main__:main
      - csg_traj_energy_calculator = chisurf.plugins.traj.potential_energy.__main__:main
      - csg_traj_remove_clashed_frames = chisurf.plugins.traj.traj_remove_clashes.__main__:main
      - csg_traj_rotate_translate = chisurf.plugins.traj.traj_rotate_translate.__main__:main
      - csg_traj_save_topology = chisurf.plugins.traj.traj_save_topology.__main__:main
      - csg_quest = quest.quest_gui:start_gui
      - csg_ndxplorer = ndxplorer.__main__:main
      - csg_trace_browser = chisurf.plugins.tttr.trace_browser.__main__:main
      - csg_tttr_image_browser = chisurf.plugins.tttr.tttr_image_browser.__main__:main
      - csg_batch_analysis = chisurf.plugins.core.batch_analysis.__main__:main
      - csg_anisotropy = chisurf.plugins.fluorescence_decay.tr_anisotropy.__main__:main
      - csg_wizards = chisurf.plugins.core.wizards.__main__:main
      - csg_calculators = chisurf.plugins.calculator.hub.__main__:main
      - chisurf_update = chisurf.plugins.core.updater.__main__:main
      # END_ENTRY_POINTS

requirements:
  # No `build:` section: nothing here is compiled. The C/C++ compilers, cmake,
  # ninja, make, cython, pythran, swig, pybind11, eigen, boost-cpp, doxygen and
  # hdf5 that used to sit here were the toolchain of the burbulator C++ library
  # and the Cython extensions, all retired -- there is no `.pyx`, no `.i` and no
  # `Extension` left in the tree, and `pip install .` links nothing. They were
  # kept alive only by rattler-recipe/build.sh, which had not run since the
  # inline `script:` above replaced it. Whatever still needs a toolchain builds
  # elsewhere: tttrlib in build_tools/build_tttrlib.py, labellib and the local
  # modules in build_tools/build_installer.py.
  host:
    - python 3.12.*
    # git backs the version fallback in chisurf/core/info.py when the build runs
    # without CHISURF_VERSION set.
    - git
    - pip
    - setuptools >=61
    - wheel
    # pyproject's [build-system] requires numpy, and --no-build-isolation means
    # the host environment is what has to supply it.
    - numpy
  # ROLE: the released conda-package deps. Keep in sync with the two sibling
  # lists that describe the SAME runtime (conda<->PyPI naming differs): the dev
  # env in pixi.toml [dependencies] and the wheel metadata in pyproject.toml
  # [project.dependencies]. numpy is unpinned to match the numpy-2 dev runtime.
  run:
    - python 3.12.*
    - numpy
    - typing-extensions >=4.14
    - pyyaml
    # msgpack-python provides `import msgpack` (the plain `msgpack` conda pkg is
    # the C lib); it backs the MMFDB payload codec / JSON-RPC service.
    - msgpack-python >=1.1.2
    - markdown
    # click-didyoumean removed: chisurf.core.cli_support.DidYouMeanGroup is the
    # in-tree replacement (a difflib call over the group's own command names).
    - click
    # pytools, msgpack-numpy and jsonschema removed: nothing in the tree (or in
    # MMFDB) imports them. tqdm removed: chisurf.core.progress draws the two
    # terminal progress bars the tree needs.
    - qtpy
    - pyqt
    - pyqtgraph
    - matplotlib
    - scikit-image
    # deprecation removed: chisurf.core.decorators.deprecated is the in-tree
    # replacement for the decorator, warning classes and docstring note.
    - pandas
    - scipy
    - numba
    # boost-cpp removed: it was a build-time C++ library that outlived the build
    # it belonged to. Nothing in the tree or in the local modules links libboost
    # -- tttrlib builds against the C++17 standard library -- so shipping it in
    # `run:` installed a compiler dependency into every user's environment.
    - ipython
    - notebook <7
    - pyopengl
    # guidata/guiqwt removed: guiqwt's users (global_tcspc, surfaceplot) were
    # ported to pyqtgraph, and guidata's DataFrameEditor was replaced by the
    # in-tree chitable widget family. No third-party GUI toolkit remains.
    - python-docx
    # scikit-learn and hdbscan removed: chisurf.core.ml holds every estimator
    # the tree reaches for (GMM, k-means, PCA, StandardScaler, MLPRegressor,
    # HDBSCAN), over a compiled kernel in the photon library.
    - ${{ "libcxx" if osx }}
    - micromamba
    - pygments
    # Imported by the application but previously left to arrive transitively --
    # true only by luck, and a packaged install is where that luck runs out.
    # Solved cost of declaring them: +2 packages (sqlalchemy and its greenlet);
    # the rest were already in the closure.
    - pyzmq >=25.0          # the ZMQ/JSON-RPC client and server
    - sqlalchemy >=2.0      # the MMFDB ORM backend
    - packaging             # version comparisons in the startup shim
    - pillow                # PNG/JPEG/RGB-TIFF reader; TIFF stacks go through
                            # tttrlib's bundled libtiff instead
    # Deliberately NOT declared: latexify-py, whose conda build stops at
    # Python 3.11 -- the parse-model LaTeX view falls back to its in-tree
    # converter. See okf/references/known-issues.md.
    - ${{ "hdf5" if win }}

# `import chisurf` is deliberately the whole test. It is cheap and it is the one
# thing that must hold for a package containing only chisurf: the top-level
# import pulls nothing outside `run:` (no Qt, no tttrlib, no mmfdb), so it fails
# exactly when a run dependency has been forgotten.
#
# There used to be a second test, `chisurf --version`. That entry point takes no
# arguments -- `chisurf.__main__.main` builds the QApplication and enters the Qt
# event loop whatever the argv -- so the test would have opened a window and
# blocked the build forever. It never ran (the driver passed `--test skip`),
# which is why nobody found out. Anything added here must be headless and must
# terminate.
tests:
  - python:
      imports:
        - chisurf

about:
  homepage: https://github.com/Fluorescence-Tools/ChiSurf
  license: GPL-2.0-only
  license_file: LICENSE
  summary: ChiSurf - an interactive global analysis platform for fluorescence data
  description: |
    ChiSurf is a software package for the global analysis of fluorescence data.
    It enables users to interlink, optimize, and jointly sample variables of models
    for time-resolved single-molecule and ensemble fluorescence experiments.

extra:
  recipe-maintainers:
    - tpeulen
