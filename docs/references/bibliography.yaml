# The works ChiSurf's documentation cites.
#
# One entry per work, keyed by <first author><year>. A page cites it with
# {cite}`key`, which renders as a link to the paper — a DOI where one is
# recorded, and a literature search for the title otherwise. The Literature
# page (docs/references/index.md) is generated from this file:
#
#     pixi run -e docs python build_tools/docs/make_bibliography.py
#
# Fields: authors, title, journal, year, volume, pages, doi, url, note, topics.
# Leave `doi` out rather than guessing one — a wrong identifier sends the reader
# to the wrong paper, which is worse than sending them to a search.

