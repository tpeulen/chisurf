guides/figures/burst_lifetime.png:
  caption: '**Left:** the VV/VH micro-time histograms of one ~2000-photon burst with the IRF and the reconvolved
    MLE model. **Right:** the E–$\tau$ plot. Static populations sit *on* the static FRET line $E = 1-\tau/\tau_0$;
    a species exchanging between two states falls on the **dynamic line**, which bows to the right because
    the decay reports the intensity-weighted lifetime while $E$ follows the species-weigh'
  kind: plot
