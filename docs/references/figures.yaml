guides/figures/accurate_fret_etau.png:
  caption: '**E–lifetime.** Both populations sit on the static line (white), as a static sample must;
    the dynamic line (red dashed) connects them. A population bowing towards the dynamic line exchanges
    within the burst; a population sitting systematically *below* the static line points at a too-large
    $\gamma$ or a wrong $\tau_{D(0)}$.'
