guides/figures/jablonski.png:
  caption: The states and the routes between them, with the timescale of each process.
  kind: diagram
  origin: docs/guides/make_figures.py::fig_jablonski
  pages:
  - docs/fundamentals/absorption_and_emission.md
  recipe: Run `python docs/guides/make_figures.py` from the repository root; drawn by `fig_jablonski()`.
    Pure matplotlib, no data.
guides/figures/lifetime_averages.png:
  caption: A two-exponential decay and the two inequivalent averages, showing why half the molecules
    can be 11% of the photons.
  kind: plot
  origin: docs/guides/make_figures.py::fig_lifetime_averages
  pages:
  - docs/fundamentals/lifetime_and_quantum_yield.md
  recipe: Run `python docs/guides/make_figures.py`; `fig_lifetime_averages()` uses amplitudes (0.5, 0.5)
    with lifetimes (0.5, 4.0) ns and calls `species_averaged_lifetime` / `fluorescence_averaged_lifetime`,
    so the printed 2.25 / 3.61 ns come from the shipped functions and not from the caption.
guides/figures/stern_volmer.png:
  caption: Dynamic, static and combined quenching -- indistinguishable in intensity, separated by the
    lifetime.
  kind: plot
  origin: docs/guides/make_figures.py::fig_stern_volmer
  pages:
  - docs/fundamentals/quenching_and_photophysics.md
  recipe: Run `python docs/guides/make_figures.py`; `fig_stern_volmer()` plots the analytic
    Stern-Volmer forms with K_D = K_S = 8 /M.
guides/figures/energy_transfer_window.png:
  caption: FRET efficiency against R/R0 with the usable window shaded, and the distance error a fixed
    0.01 error in E produces.
  kind: plot
  origin: docs/guides/make_figures.py::fig_energy_transfer_window
  pages:
  - docs/fundamentals/energy_transfer.md
  recipe: Run `python docs/guides/make_figures.py`; `fig_energy_transfer_window()` calls
    `distance_to_fret_efficiency`, so the quoted 0.985 and 0.0154 are computed. The right panel is left
    blank where E < dE, because there the distance is unbounded rather than merely imprecise -- clipping
    it draws a flat plateau that looks physical and is not.
guides/figures/perrin.png:
  caption: Anisotropy decays for three rotational correlation times and one restricted case, with the
    Perrin sensitivity curve.
  kind: plot
  origin: docs/guides/make_figures.py::fig_perrin
  pages:
  - docs/fundamentals/polarization_and_rotation.md
  recipe: Run `python docs/guides/make_figures.py`; `fig_perrin()` evaluates the interleaved
    (beta, rho) rotation spectrum directly and the Perrin form r/r0 = 1/(1 + tau/rho), with r0 = 0.38.
guides/figures/kappa2_models.png:
  caption: Three orientation models with the same mean kappa-squared of 2/3 and distance errors of 2%,
    15% and 24%.
  kind: plot
  origin: docs/guides/make_figures.py::fig_kappa2_models
  pages:
  - docs/concepts/kappa2_orientation.md
  recipe: Run `python docs/guides/make_figures.py`; `fig_kappa2_models()` calls the plugin's own
    `compute_kappa2_dist` for the isotropic case and for WIC at (r_Dinf, r_Ainf) = (0.01, 0.02) and
    (0.15, 0.20), with r_0 = 0.38 and seed 20260806. The cone model samples orientations, so the seed
    is what makes the figure reproducible.
guides/figures/kappa2_tool.png:
  caption: The kappa-squared calculator with a restricted dye pair -- mean kappa-squared still 0.66,
    but a 15% systematic range on the distance.
  kind: screenshot
  origin: docs/guides/make_screenshots.py::_grab_kappa2_tool
  pages:
  - docs/guides/61_kappa2_distribution.md
  recipe: 'QT_QPA_PLATFORM=offscreen PYTHONPATH=. python docs/guides/make_screenshots.py. The tool is
    opened with defaults, then r_Dinf is set to 0.15 and r_Ainf to 0.20 -- deliberately restricted, so
    the panel shows a real distance penalty instead of the near-zero one a mobile pair gives -- and
    Compute is pressed.'
guides/figures/maxent_nu.png:
  caption: One broad lifetime distribution recovered at three regularization weights; the best-fitting
    one splits it into two peaks that are not there.
  kind: plot
  origin: docs/guides/make_figures.py::fig_maxent_nu
  pages:
  - docs/concepts/maximum_entropy.md
  recipe: Run `python docs/guides/make_figures.py`; `fig_maxent_nu()` simulates a decay from a Gaussian
    p(tau) centred at 2.6 ns (sigma 0.55 ns), 4e4 peak counts, seed 20260806, and inverts it with the
    plugin's own `solve_lifetime_mem` at nu = 1e-9, 1e-6 and 1e-5. Those values bracket the corner for
    this decay -- below 1e-9 the solution grows spurious support down to 0.1 ns, above 1e-5 chi2r blows
    up -- so changing the simulated decay means re-probing the range, not reusing these three.

# ── Concept (theory) pages: docs/concepts/make_figures.py ───────────
concepts/figures/fret_ruler.png:
  caption: The efficiency-distance curve with its usable window, and the same relation read as
    the amplification of an efficiency error into a distance error.
  kind: plot
  origin: docs/concepts/make_figures.py::fig_fret_ruler
  pages:
  - docs/concepts/fret.md
  recipe: Run `python docs/concepts/make_figures.py fret_ruler`. Left panel calls the shipped
    `distance_to_fret_efficiency` over R = 0.3-2.0 R0 with R0 = 52 A and shades 0.5-1.5 R0. Right
    panel plots 1/[6E(1-E)] on a log axis over E = 0.02-0.98 and marks E = 0.1, 0.5, 0.9. No random
    numbers. Regenerating after a change to the efficiency function is the point of drawing it from
    that function rather than from the formula in the text.

concepts/figures/anisotropy_decays.png:
  caption: Anisotropy decays for free, protein-bound and hindered rotation, and the VV/VH pair each
    one produces.
  kind: plot
  origin: docs/concepts/make_figures.py::fig_anisotropy_decays
  pages:
  - docs/concepts/anisotropy.md
  recipe: Run `python docs/concepts/make_figures.py anisotropy_decays`. A 4 ns mono-exponential
    magic-angle decay on 0-30 ns is passed to the shipped `vm_rt_to_vv_vh` with rotation spectra
    [0.38, 0.5], [0.38, 12] and [0.23, 12, 0.15, 1e6] (the last is the r_inf term written as a very
    slow rho). The right panel shows VV (solid) and VH (dashed) for the first and last only -- the
    contrast between channels that meet and channels that never do is what it is there for. No random
    numbers.

concepts/figures/lifetime_averages.png:
  caption: A two-component decay with both averages marked, beside the species and intensity
    fractions of the same two species.
  kind: plot
  origin: docs/concepts/make_figures.py::fig_lifetime_averages
  pages:
  - docs/concepts/tcspc_lifetime.md
  recipe: Run `python docs/concepts/make_figures.py lifetime_averages`. Lifetime spectrum
    [0.5, 0.5, 0.5, 4.0] on 4096 channels of 12.2 ps, reconvolved by the shipped
    `convolve_lifetime_spectrum` with a Gaussian IRF of 90 ps sigma at 1.2 ns. The averages and
    fractions are computed from the spectrum, so they must keep matching the numbers in the page
    text (2.25 ns, 3.61 ns, 11 %). No random numbers.

concepts/figures/fcs_factors.png:
  caption: A correlation curve decomposed into its diffusion and photodynamics factors.
  kind: plot
  origin: docs/concepts/make_figures.py::fig_fcs_factors
  pages:
  - docs/concepts/fcs_correlation.md
  recipe: Run `python docs/concepts/make_figures.py fcs_factors`. Analytic 3-D Gaussian diffusion
    (tau_D = 38 us, gamma = 5) times a triplet term (theta = 0.18, tau_trip = 3 us), amplitude 1/N
    with N = 2, over lags 1e-7 to 1 s. The parameters match the worked calibration on the page, so
    changing one means changing both.

concepts/figures/av_distances.png:
  caption: A distance distribution with its plain and FRET averages, and the gap between them as a
    function of the mean, showing where it changes sign.
  kind: plot
  origin: docs/concepts/make_figures.py::fig_av_distances
  pages:
  - docs/concepts/accessible_volume.md
  recipe: Run `python docs/concepts/make_figures.py av_distances`. Gaussian P(R) sampled on 20001
    points over +/- 6 sigma, truncated below 1 A -- the same recipe the table on the page states, so
    the right panel is a drawing of that table and must agree with it. Left panel uses mean 62 A,
    sigma 12 A; right panel sweeps the mean from 30 to 85 A for sigma = 6, 10 and 15 A, with the
    inflection at (5/7)^(1/6) R0 marked. R0 = 52 A throughout. No random numbers.

concepts/figures/bva_static_line.png:
  caption: BVA static lines for three slice sizes, with a dynamic burst population sitting above
    them.
  kind: plot
  origin: docs/concepts/make_figures.py::fig_bva_static_line
  pages:
  - docs/concepts/bva.md
  recipe: Run `python docs/concepts/make_figures.py bva_static_line`. The lines come from the shipped
    `compute_static_bva_line` on 49 bins over E = 0.02-0.98 at n = 5, 10 and 20 photons per slice,
    4000 samples -- it is a Monte Carlo, so the lines are slightly ragged by construction and a
    perfectly smooth curve would mean the analytic form was drawn instead. The grey cloud is
    illustrative, seeded (`default_rng(3)`), at 1.35x the n = 5 floor.

concepts/figures/pch_brightness.png:
  caption: Two photon-counting histograms with the same mean and different molecular brightness.
  kind: plot
  origin: docs/concepts/make_figures.py::fig_pch_brightness
  pages:
  - docs/concepts/pch_fida.md
  recipe: Run `python docs/concepts/make_figures.py pch_brightness`. Calls the shipped
    `pch_open_system` for (epsilon*T = 1.0, N = 2) and (0.5, 4) over k = 0-11 on a log axis. The two
    give the same mean count by construction, which is the figure's whole claim; if a change makes
    the means differ the parameters are wrong, not the plot.

concepts/figures/phasor_circle.png:
  caption: The universal semicircle with a lifetime scale and the chord a two-component pixel lies
    on.
  kind: plot
  origin: docs/concepts/make_figures.py::fig_phasor_circle
  pages:
  - docs/concepts/imaging_flim_phasor.md
  recipe: Run `python docs/concepts/make_figures.py phasor_circle`. Semicircle of radius 1/2 centred
    at (1/2, 0); single-exponential points at 0.5, 1, 2, 4, 8 ns for omega = 2*pi*80 MHz; chord
    between 0.6 and 4 ns with quarter markers. The repetition rate sets where the lifetime ticks
    land, so changing it means re-checking that the labelled ticks still span the arc.

concepts/figures/frc_thresholds.png:
  caption: One FRC curve against three thresholds, each crossed at a different frequency.
  kind: plot
  origin: docs/concepts/make_figures.py::fig_frc_thresholds
  pages:
  - docs/concepts/frc_resolution.md
  recipe: Run `python docs/concepts/make_figures.py frc_thresholds`. A Gaussian FRC decay
    (q_c = 0.085 /nm) against the fixed 1/7, the 1/2-bit and the 2-sigma thresholds, with the ring
    counts taken as 2*pi*q/dq. A crossing is reported only after the curve has been *above* the
    threshold -- without that rule the count-dependent criteria trigger in the first ring, which is
    the failure the page warns about and the figure must not itself commit.
guides/figures/distributed_acceptors.png:
  caption: Donor decays and transfer efficiencies for acceptors distributed in one, two and three
    dimensions; at equal density the curves cross.
  kind: plot
  origin: docs/guides/make_figures.py::fig_distributed_acceptors
  pages:
  - docs/concepts/distributed_acceptors.md
  recipe: Run `python docs/guides/make_figures.py`; `fig_distributed_acceptors()` calls
    `chisurf.core.fluorescence.fret.dimensionality.donor_decay` and `transfer_efficiency` with
    tau_D(0) = 4 ns at C = C0. The left panel is deliberately log-log -- the distinguishing feature is
    the short-time behaviour, and a linear time axis compresses the crossing into the first pixel
    column. The marked efficiencies (0.724, 0.672, 0.642) are computed, not quoted.
guides/figures/static_quenching_mechanisms.png:
  caption: Dynamic, sphere-of-action and complex quenching give three different intensity plots and one
    identical lifetime plot.
  kind: plot
  origin: docs/guides/make_figures.py::fig_static_quenching_mechanisms
  pages:
  - docs/fundamentals/quenching_and_photophysics.md
  recipe: Run `python docs/guides/make_figures.py`; analytic curves at K_D = 8 /M, a 7 A sphere of action
    (V*N_A/1000 = 0.865 /M) and K_S = 5 /M. All three share K_D deliberately -- that is what makes the
    right panel's point that the lifetime reports the dynamic part and nothing else. The printed radius
    needed to mimic K_S = 5 /M with a sphere (12.6 A) is computed, not quoted.
guides/figures/quenching_mixtures.png:
  caption: Incomplete quenching and an inaccessible population are the same function - both bend F0/F
    downward onto a plateau - and the modified plot returns an inflated fraction when the inert population
    is not truly inert.
  kind: plot
  origin: docs/guides/make_figures.py::fig_quenching_mixtures
  pages:
  - docs/fundamentals/quenching_and_photophysics.md
  recipe: 'Run `python docs/guides/make_figures.py`; f = 0.5, K_a = 5 /M, with K_b = 0 (which is
    algebraically identical to incomplete static quenching with an unquenchable fraction f) and
    K_b = 0.1 K_a. The quencher range runs to 4 M so the plateau at 1/(1-f) is actually reached -- at
    1 M it is not, and the panel then shows a bend with nothing to bend onto.
    The quoted intercepts are least-squares fits over 1 < 1/[Q] < 8 -- a deliberately ordinary window --
    and give f_a = 0.50 and 0.74 against a truth of 0.50. Changing that window changes the second number,
    which is the point being made, so it is fitted rather than asserted.'
guides/figures/transient_quenching.png:
  caption: The time-dependent quenching rate, and the non-exponential decay it produces for a single
    species with a single quencher.
  kind: plot
  origin: docs/guides/make_figures.py::fig_transient_quenching
  pages:
  - docs/fundamentals/quenching_mechanisms.md
  recipe: Run `python docs/guides/make_figures.py`; the constants are the defaults of ChiSurf's shipped
    `Transient-Quenching` parse model (tau0 = 4 ns, R = 7.5 A, D = 40 A^2/ns, Vav = 16755 A^3), so the
    figure and the fittable model cannot drift apart. The right panel is deliberately cut at 4 ns and
    carries the curve's own extrapolated long-time slope - over 0-20 ns the curve merely looks steeper
    and the non-exponentiality is invisible.
guides/figures/rehm_weller.png:
  caption: Quenching rate against driving force, plateauing at the diffusion limit, with the four
    nucleobases marked by their ordering.
  kind: plot
  origin: docs/guides/make_figures.py::fig_rehm_weller
  pages:
  - docs/fundamentals/quenching_mechanisms.md
  recipe: 'Run `python docs/guides/make_figures.py`; the Rehm-Weller expression with dG_act = dG/2 +
    sqrt((dG/2)^2 + dG0^2), dG0 = 0.1 eV, k_diff = 1e10 /M/s. IMPORTANT: the nucleobases are placed by
    their known ORDERING, not at measured dG values, and they sit on the rising part of the curve rather
    than the plateau because that is where the bases actually differ. Moving them onto the plateau would
    make the figure say the opposite of what the ordering means. The caption states this.'
