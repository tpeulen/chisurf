# Where every figure in the documentation came from.
#
# Keyed by the image path relative to docs/. The register
# (docs/reference/figures.md) is generated from this file plus a scan of the
# pages, so an image used without an entry here shows up as *unrecorded*.
#
# Fields:
#   caption  what the figure shows (the page's caption is used when absent)
#   origin   script::function, a plugin, or the document it was extracted from
#   kind     plot | screenshot | diagram | legacy screenshot
#   recipe   how to make it again -- detailed enough to follow without asking
#   pages    where it is used
#
# A screenshot's recipe must name the tool, the data it was driven with and the
# state it was in, so it can be retaken without guessing.

