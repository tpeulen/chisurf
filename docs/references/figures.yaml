guides/figures/burst_gs_transition_time.png:
  caption: 'The expected result: flat at zero while the crossing is too fast to leave a trace, falling
    steeply once it is long enough to be visible. The flat region is the answer — the crossing is faster
    than the point where the curve breaks. This is an upper bound, and reporting it as one is the honest
    reading.'
