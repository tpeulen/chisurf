guides/figures/burst_gs_workspace.png:
  caption: 'Fitted on simulated photons from a molecule with known kinetics — 3000 and 1000 s⁻¹ between
    states at E = 0.25 and 0.75. The fit returns 2879 and 1027 s⁻¹ at E = 0.244 and 0.750, and a 256 µs
