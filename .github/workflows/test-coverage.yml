name: Pixi Tests & Quality

on:
  workflow_dispatch:

env:
  PIXI_VERSION: latest

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          cache: false
          locked: false

      - name: Run Ruff
        run: pixi run --environment dev lint

      # Non-blocking: mypy never actually ran to completion in CI before
      # 2026-09-17 (the job always failed earlier, at a wrong-pixi-environment
      # exit 127), so this surfaces 5,545 pre-existing errors across 757
      # files -- real debt, but far beyond a CI fix, not a regression. Runs
      # and reports so the count is visible, without gating the job on it.
      - name: Run MyPy
        run: pixi run --environment dev typecheck
        continue-on-error: true

  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-2022]

    steps:
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential xvfb libgl1-mesa-dev

      # Without this, Git for Windows checks out repo symlinks (modules/mmfdb,
      # modules/tttrlib, modules/quest, modules/chimol) as plain text files
      # containing the link target, not real directory links -- so every
      # build-* task that does `pip install -e modules/<name>` fails with
      # "not a valid editable requirement" on Windows. Must be set before the
      # checkout that follows; the runner is already elevated, so this is
      # enough (no Developer Mode toggle needed).
      - name: Enable symlinks (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Checkout mmfdb (sibling for the modules/mmfdb symlink)
        shell: bash
        run: |
          git clone --depth 1 --branch "${MMFDB_REF:-main}" \
            "${MMFDB_REPO:-https://github.com/tpeulen/mmfdb.git}" \
            "$GITHUB_WORKSPACE/../mmfdb"

      # tttrlib is built from source (build-tttrlib), not taken from conda: the
      # published package lags far enough to be wrong, not merely old.
      - name: Checkout tttrlib (sibling for the modules/tttrlib symlink)
        shell: bash
        run: |
          git clone --depth 1 --branch "${TTTRLIB_REF:-dev}" \
            "${TTTRLIB_REPO:-https://github.com/tpeulen/tttrlib.git}" \
            "$GITHUB_WORKSPACE/../tttrlib"

      # quest is built from source (build-quest), same sibling-checkout
      # pattern as mmfdb/tttrlib -- modules/quest is a symlink to ../../quest.
      - name: Checkout quest (sibling for the modules/quest symlink)
        shell: bash
        run: |
          git clone --depth 1 --branch "${QUEST_REF:-dev}" \
            "${QUEST_REPO:-https://github.com/tpeulen/quest.git}" \
            "$GITHUB_WORKSPACE/../quest"

      # chimol is built from source (build-chimol), same sibling-checkout
      # pattern -- modules/chimol is a symlink to ../../chimol. Private (not
      # released yet), so the clone needs the read-only deploy key
      # (CHIMOL_DEPLOY_KEY, added to tpeulen/chimol 2026-09-17) rather than
      # an anonymous HTTPS clone.
      - name: Set up chimol deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CHIMOL_DEPLOY_KEY }}

      - name: Checkout chimol (sibling for the modules/chimol symlink)
        shell: bash
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone --depth 1 --branch "${CHIMOL_REF:-development}" \
            "${CHIMOL_REPO:-git@github.com:tpeulen/chimol.git}" \
            "$GITHUB_WORKSPACE/../chimol"

      # `git config core.symlinks true` (above) is not enough on GitHub's
      # stock windows-2022 runner: creating a real symlink additionally needs
      # SeCreateSymbolicLinkPrivilege enabled in the process token, which
      # even the runneradmin account doesn't have without Developer Mode.
      # Git silently falls back to writing modules/<name> as a plain text
      # file containing the link target, so every `pip install -e
      # modules/<name>` then fails with "not a valid editable requirement".
      # NTFS junctions need no special privilege, so replace each
      # placeholder with a real junction pointing at the sibling checkout.
      - name: Fix module symlinks as junctions (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parent = Split-Path $env:GITHUB_WORKSPACE -Parent
          foreach ($name in @("mmfdb", "tttrlib", "quest", "chimol")) {
            $link = "modules/$name"
            if ((Get-Item $link).LinkType -ne "Junction") {
              Remove-Item $link -Force
              New-Item -ItemType Junction -Path $link -Target (Join-Path $parent $name) | Out-Null
            }
          }

      # conda-forge's Windows hdf5 package is not discoverable by CMake's
      # traditional find_package(HDF5) the way tttrlib's cmake/FindHDF5.cmake
      # uses it -- confirmed on real CI even with HDF5_ROOT and
      # CMAKE_PREFIX_PATH pointed at the conda env ("Could NOT find HDF5").
      # tttrlib's own CI hits the same wall and works around it with a
      # vcpkg-built HDF5 instead; mirroring that here. windows-2022/-latest
      # runners ship vcpkg pre-installed, with VCPKG_INSTALLATION_ROOT
      # already set.
      - name: Resolve the vcpkg root into the env context
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "VCPKG_ROOT_RESOLVED=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Cache vcpkg HDF5
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT_RESOLVED }}\installed
          key: vcpkg-hdf5-core-zlib-x64-windows-${{ runner.os }}-v1

      - name: Install HDF5 via vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkg = "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe"
          $attempts = 3
          for ($i = 1; $i -le $attempts; $i++) {
            & $vcpkg install hdf5[core,zlib]:x64-windows --recurse --no-print-usage
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq $attempts) { exit 1 }
            Write-Host "vcpkg install failed (attempt $i of $attempts); retrying in 90 s"
            Start-Sleep -Seconds 90
          }
          $root = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
          # A partially restored cache reports "already installed" and the
          # install above short-circuits without actually completing it, so
          # verify the tree is real rather than trust the exit code alone.
          foreach ($f in @("bin\hdf5.dll", "lib\hdf5.lib", "include\hdf5.h")) {
            if (-not (Test-Path "$root\$f")) {
              Write-Host "::error::vcpkg reported success but $root\$f is missing."
              Write-Host "The cached vcpkg tree is incomplete. Bump the key suffix"
              Write-Host "(vcpkg-hdf5-...-v1) to force a clean rebuild."
              exit 1
            }
          }

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          cache: false
          locked: false

      - name: Run tests with coverage (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pixi run --environment test test-cov

      - name: Upload coverage to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: unittests
          fail_ci_if_error: false

      - name: Upload coverage reports
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: |
            coverage.xml
            htmlcov/
          retention-days: 30

      - name: Run tests (macOS / Windows)
        if: runner.os != 'Linux'
        run: pixi run --environment test test
