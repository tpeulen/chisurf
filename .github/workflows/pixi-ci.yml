name: Build and Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - alpha
          - beta
          - rc
          - stable
  push:
    branches: [development, main]
    tags: ["v*"]
  release:
    types: [released, prereleased]
  schedule:
    - cron: "0 11 * * 1"

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      OUT_DIR: conda-bld
      PIXI_VERSION: latest

    steps:

      # Without this, Git for Windows checks out repo symlinks (modules/mmfdb,
      # modules/tttrlib, modules/quest, modules/chimol) as plain text files
      # containing the link target, not real directory links -- so every
      # build-* task that does `pip install -e modules/<name>` fails with
      # "not a valid editable requirement" on Windows. Must be set before the
      # checkout that follows; the runner is already elevated, so this is
      # enough (no Developer Mode toggle needed).
      - name: Enable symlinks (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true

      - name: Checkout (with tags & submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Checkout mmfdb (sibling for the modules/mmfdb symlink)
        shell: bash
        run: |
          git clone --depth 1 --branch "${MMFDB_REF:-main}" \
            "${MMFDB_REPO:-https://github.com/tpeulen/mmfdb.git}" \
            "$GITHUB_WORKSPACE/../mmfdb"

      # tttrlib is built from source (build-tttrlib), not taken from conda: the
      # published package lags far enough to be wrong, not merely old.
      - name: Checkout tttrlib (sibling for the modules/tttrlib symlink)
        shell: bash
        run: |
          git clone --depth 1 --branch "${TTTRLIB_REF:-dev}" \
            "${TTTRLIB_REPO:-https://github.com/tpeulen/tttrlib.git}" \
            "$GITHUB_WORKSPACE/../tttrlib"

      # quest is built from source (build-quest), same sibling-checkout
      # pattern as mmfdb/tttrlib -- modules/quest is a symlink to ../../quest.
      - name: Checkout quest (sibling for the modules/quest symlink)
        shell: bash
        run: |
          git clone --depth 1 --branch "${QUEST_REF:-dev}" \
            "${QUEST_REPO:-https://github.com/tpeulen/quest.git}" \
            "$GITHUB_WORKSPACE/../quest"

      # chimol is built from source (build-chimol), same sibling-checkout
      # pattern -- modules/chimol is a symlink to ../../chimol. Private (not
      # released yet), so the clone needs the read-only deploy key
      # (CHIMOL_DEPLOY_KEY, added to tpeulen/chimol 2026-09-17) rather than
      # an anonymous HTTPS clone.
      - name: Set up chimol deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CHIMOL_DEPLOY_KEY }}

      - name: Checkout chimol (sibling for the modules/chimol symlink)
        shell: bash
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone --depth 1 --branch "${CHIMOL_REF:-development}" \
            "${CHIMOL_REPO:-git@github.com:tpeulen/chimol.git}" \
            "$GITHUB_WORKSPACE/../chimol"

      # `git config core.symlinks true` (above) is not enough on GitHub's
      # stock windows-latest runner: creating a real symlink additionally
      # needs SeCreateSymbolicLinkPrivilege enabled in the process token,
      # which even the runneradmin account doesn't have without Developer
      # Mode. Git silently falls back to writing modules/<name> as a plain
      # text file containing the link target, so every `pip install -e
      # modules/<name>` then fails with "not a valid editable requirement".
      # NTFS junctions need no special privilege, so replace each
      # placeholder with a real junction pointing at the sibling checkout.
      - name: Fix module symlinks as junctions (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parent = Split-Path $env:GITHUB_WORKSPACE -Parent
          foreach ($name in @("mmfdb", "tttrlib", "quest", "chimol")) {
            $link = "modules/$name"
            if ((Get-Item $link).LinkType -ne "Junction") {
              Remove-Item $link -Force
              New-Item -ItemType Junction -Path $link -Target (Join-Path $parent $name) | Out-Null
            }
          }

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential xvfb \
            libgl1-mesa-dev libfuse2 qtbase5-dev patchelf desktop-file-utils file

      - name: Set macOS SDK
        if: runner.os == 'macOS'
        run: bash build_tools/install_macos_sdk.sh

      # conda-forge's Windows hdf5 package is not discoverable by CMake's
      # traditional find_package(HDF5) the way tttrlib's cmake/FindHDF5.cmake
      # uses it -- confirmed on real CI even with HDF5_ROOT and
      # CMAKE_PREFIX_PATH pointed at the conda env ("Could NOT find HDF5").
      # tttrlib's own CI hits the same wall and works around it with a
      # vcpkg-built HDF5 instead; mirroring that here. windows-2022/-latest
      # runners ship vcpkg pre-installed, with VCPKG_INSTALLATION_ROOT
      # already set.
      - name: Resolve the vcpkg root into the env context
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "VCPKG_ROOT_RESOLVED=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Cache vcpkg HDF5
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT_RESOLVED }}\installed
          key: vcpkg-hdf5-core-zlib-x64-windows-${{ runner.os }}-v1

      - name: Install HDF5 via vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkg = "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe"
          $attempts = 3
          for ($i = 1; $i -le $attempts; $i++) {
            & $vcpkg install hdf5[core,zlib]:x64-windows --recurse --no-print-usage
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq $attempts) { exit 1 }
            Write-Host "vcpkg install failed (attempt $i of $attempts); retrying in 90 s"
            Start-Sleep -Seconds 90
          }
          $root = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
          # A partially restored cache reports "already installed" and the
          # install above short-circuits without actually completing it, so
          # verify the tree is real rather than trust the exit code alone.
          foreach ($f in @("bin\hdf5.dll", "lib\hdf5.lib", "include\hdf5.h")) {
            if (-not (Test-Path "$root\$f")) {
              Write-Host "::error::vcpkg reported success but $root\$f is missing."
              Write-Host "The cached vcpkg tree is incomplete. Bump the key suffix"
              Write-Host "(vcpkg-hdf5-...-v1) to force a clean rebuild."
              exit 1
            }
          }

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: ${{ env.PIXI_VERSION || 'latest' }}
          cache: false
          locked: false
          environments: build

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup -y --no-progress

      # Single toolchain: pixi drives the whole packaging chain. The `build-installer`
      # task depends-on `build-pkg` (rattler-build) -> `build-extensions`, and the
      # `build` feature provides rattler-build/micromamba/cmake/eigen/etc. This
      # replaces the former hand-rolled micromamba + rattler-build steps so pixi is
      # the one build tool everywhere (dev, tests, and release).
      - name: Build conda package + installer (pixi)
        shell: bash -l {0}
        run: |
          CHISURF_VERSION=$(pixi run -e build python rattler-recipe/generate_version.py --print)
          echo "CHISURF_VERSION=$CHISURF_VERSION" >> $GITHUB_ENV
          export CHISURF_VERSION
          pixi run -e build python rattler-recipe/collect_entry_points.py || true
          pixi run -e build build-installer

      # Launch the freshly built installable app on the runner OS and confirm it
      # reaches the main window. CHISURF_SMOKE_TEST makes the app skip the
      # interactive login, paint, write the sentinel, then quit (see
      # chisurf/gui/__init__.py). macOS launches the .app bundle via `open`
      # (which does not propagate the exit code, hence the sentinel); Linux and
      # Windows launch their runtime directly and also rely on the exit code.
      - name: Smoke-test macOS .app (open)
        if: runner.os == 'macOS'
        shell: bash -l {0}
        run: |
          set -euo pipefail
          APP="dist/${APP_NAME:-ChiSurf}.app"
          test -d "$APP" || { echo "ERROR: $APP not found"; exit 1; }
          SENTINEL="$PWD/dist/smoke_ok"
          rm -f "$SENTINEL"
          export CHISURF_SMOKE_TEST=1 CHISURF_SMOKE_SENTINEL="$SENTINEL" CHISURF_SMOKE_DELAY_MS=5000
          # Watchdog: kill a hung app so the job fails fast instead of timing out.
          ( sleep 180; pkill -f "$PWD/dist/.*python" 2>/dev/null || true ) &
          WD=$!
          open -W "$APP" || true
          kill "$WD" 2>/dev/null || true
          test -f "$SENTINEL" || { echo "ERROR: ChiSurf.app did not reach startup"; exit 1; }
          echo "macOS .app started OK"
        env:
          APP_NAME: ChiSurf

      - name: Smoke-test Linux AppImage
        if: runner.os == 'Linux'
        shell: bash -l {0}
        run: |
          set -euo pipefail
          APP=$(ls dist/ChiSurf-*-x86_64.AppImage | head -n1)
          test -n "$APP" || { echo "ERROR: no AppImage found"; exit 1; }
          chmod +x "$APP"
          export CHISURF_SMOKE_TEST=1 CHISURF_SMOKE_DELAY_MS=5000 APPIMAGE_EXTRACT_AND_RUN=1
          timeout 180 xvfb-run -a "$APP"
          echo "Linux AppImage started OK"

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: dist/*.dmg
          if-no-files-found: error

      - name: Upload Linux AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: appimage-linux
          path: dist/ChiSurf-*-x86_64.AppImage
          if-no-files-found: error

      - name: Smoke-test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-ChildItem dist/ChiSurf-Windows-Setup-*.exe | Select-Object -First 1
          if (-not $exe) { throw "no Windows installer found" }
          $dir = Join-Path $env:RUNNER_TEMP "chisurf-install"
          # Silent per-machine install into a known dir (skips the scope dialog).
          Start-Process -FilePath $exe.FullName -Wait -ArgumentList `
            "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dir"
          $py = Join-Path $dir "python.exe"
          if (-not (Test-Path $py)) { throw "install did not produce $py" }
          $sentinel = Join-Path $env:RUNNER_TEMP "smoke_ok"
          Remove-Item $sentinel -ErrorAction SilentlyContinue
          $env:CHISURF_SMOKE_TEST = "1"
          $env:CHISURF_SMOKE_SENTINEL = $sentinel
          $env:CHISURF_SMOKE_DELAY_MS = "5000"
          $p = Start-Process -FilePath $py -ArgumentList "-m","chisurf" -PassThru -NoNewWindow
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "ChiSurf timed out on startup" }
          if (-not (Test-Path $sentinel)) { throw "ChiSurf did not reach startup" }
          Write-Host "Windows install started OK"

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Upload Linux conda packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: packages-linux
          path: |
            ${{ env.OUT_DIR }}/linux-64/**/*.conda
            ${{ env.OUT_DIR }}/noarch/**/*.conda
          if-no-files-found: error

      - name: Upload macOS conda packages
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: packages-macos
          path: |
            ${{ env.OUT_DIR }}/osx-64/**/*.conda
            ${{ env.OUT_DIR }}/osx-arm64/**/*.conda
          if-no-files-found: error

      - name: Upload Windows conda packages
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: packages-windows
          path: ${{ env.OUT_DIR }}/win-64/**/*.conda
          if-no-files-found: error

  release:
    name: Upload to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: installer-windows
          path: artifacts/windows

      - name: Download macOS installer artifact
        uses: actions/download-artifact@v4
        with:
          name: installer-macos
          path: artifacts/macos

      - name: Download Linux conda packages
        uses: actions/download-artifact@v4
        with:
          name: packages-linux
          path: conda-packages/linux

      - name: Download Linux AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: appimage-linux
          path: artifacts/linux

      - name: Download macOS conda packages
        uses: actions/download-artifact@v4
        with:
          name: packages-macos
          path: conda-packages/macos

      - name: Download Windows conda packages
        uses: actions/download-artifact@v4
        with:
          name: packages-windows
          path: conda-packages/windows

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/linux/*.AppImage
            artifacts/macos/*.dmg
            artifacts/windows/*.exe
            conda-packages/**/*.conda
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
